name: Aevis

options:
  bundleIdPrefix: com.aevis
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    # ⚠️ 版本号要**单调递增**（用户靠它分辨新旧），而且**必须等于包内的真实版本** ——
    # 上次就是按"上一次成功的是 56、下一个该是 57"去推算，可那次推送因为
    # 连接器断线根本没触发构建 → 写成了 58、实际 tag 是 build-57。
    # 推之前先查一次 `GET /repos/.../actions/runs?per_page=1` 看真实的 N。
    #
    # ⚠️⚠️ 2026-09-26 又栽了一次，是**部署那一步**：build-60 的包里写的是 0.0.60，
    #   我却 `deploy_server.py 61 …` 去部署 → source.json 标成 0.0.61，
    #   而用户装到手机上看到的是 0.0.60。**部署脚本的第一个参数是"包里的版本号"，
    #   不是 run_number**（两者相等是靠每次都对上，不是自动的）。
    # ⚠️ 2026-09-28 0.0.77：iPad 真布局（分栏，不再是手机布局拉伸）
    #    + 停用屏加申诉指引（封禁闭环的 App 侧收口）。
    # ⚠️ 2026-09-28 0.0.78：App 端账号跟账号走（昵称/头像/账号号显示 + 密码登录）
    #    + 清掉构建日志里全部 17 条警告（含 QQBot 锁、WebAuth 主线程、字体注册静默失败）。
    # ⚠️ 2026-09-28 0.0.79：**打开聊天默认滚到底**（补 onAppear，以前只有 onChange）
    #    + 「外观」卡分类（7 个可折叠组头，并把「聊天背景」从最后一屏提到第一位）。
    # ⚠️ 2026-09-28 0.0.80：「外观」卡里 4 处跟组头一字不差重复的小标题删掉。
    # ⚠️ 2026-09-28 0.0.81：**聊天默认贴底**（`.defaultScrollAnchor(.bottom)` ——
    #    以前只有 onChange 滚到底，消息不满一屏时根本滚不动，所以在用户看来
    #    就是打开停在最上面）+ 发现页只留朋友圈（抖音收起）+ 外观卡默认只展开
    #    「聊天背景」「气泡与圆角」。
    # ⚠️ 2026-09-28 0.0.82：键盘弹出/收起都重新贴底；加号面板只留「相册/拍照」
    #    （「文件」撤掉）、「朋友圈」改成「转发朋友圈」；「TA 的资料」只留「编辑资料」；
    #    外观入口只看聊天背景+气泡圆角（完整的仍在总设置里）；朋友圈封面能拉大/点成全屏、
    #    评论可回复；装扮朋友圈加「我在 TA 朋友圈里的样子」；新增个性签名。
    # ⚠️ 2026-09-28 0.0.83：**登录搬进 App 并强制登录** —— 验证码 / 密码 / 注册码 /
    #    QQ 四条路都在 App 里做完（不再跳系统浏览器，QQ 走内置浏览器）；
    #    进门顺序 = 先设备码、再登录；退出登录回登录页；
    #    「我的资料」的名字和头像跟着账号走；登录后自动把设备码绑到账号上。
    # ⚠️ 2026-09-29 0.0.84：**假钱包**（转账 / 红包气泡 + 两边余额，纯本地假数据）
    #    + **弹窗消息落进聊天记录**（通知里带上正文，App 一起来就补进会话；
    #      前台时当场落进聊天、不弹横幅）。
    # ⚠️ 2026-09-29 0.0.85：0.0.84 的**文案修正**。
    #    钱包底部那行是 `Text("…" + "…")` —— 拼接出来的字符串走 `Text(String)`
    #    重载，`**加粗**` 不解析，**星号原样显示**（截图里明晃晃的，就是抓出来的）。
    #    改成 `Text(LocalizedStringKey(…))`；顺带给本地检查器补了 R17（以前它看到
    #    字面量紧跟 `Text(` 就放行，没注意后面接了 `+`）。
    # ⚠️ 2026-10-01 0.0.87：
    #    ① **修「app 登录界面串了」**（用户截图投诉）：`LoginView` 里两条
    #       `Text("…**已经注册过**…")` 是**单行字面量** —— SwiftUI 只在
    #       `Text(LocalizedStringKey(…))` 下解析 markdown，单行字面量走
    #       `Text(String)`，**星号原样露着**。这轮把 R17 判据收紧（以前它把
    #       "紧跟 Text( 的字面量"当安全放过 —— 那个依据是错的），一收紧又抓出
    #       另外 4 处历史遗漏（抖音两处 / Bark 一处 / 抖音浏览器一处），一并修掉。
    #        ⚠️ **教训**：检查器说"没问题"而用户看得见星号，比没有检查器更糟。
    #    ② 聊天更真人、QQ 记忆互通等 11 项（详见下面的 0.0.87 段）。
    # ⚠️ 2026-10-01 0.0.88：**修「搬家什么都不搬」**（用户实测报的：
    #    「人设、聊天记录、记忆、朋友圈这些都没有」）。两个 bug：
    #
    #    ① **`stash()` 把刚搬进来的数据当场覆盖掉**（主因）。
    #       恢复的顺序是「先导 contacts → `broadcastSwitch` 切人 → 再导其余三家」，
    #       而切人会让每个 Store 先 `stash()`（把内存里那份写回字典）。
    #       那一刻 `currentID`/`owner` 还停在**这台旧机器**上的人，于是旧会话被
    #       写回字典、最后落盘的是旧数据 —— 表现就是「一条都没搬过来」。
    #       修法：四个 Store（Chat/Memory/Moment + Persona 的调用链）都加 `loading`
    #       标志位，导入与读档期间 `stash()` / `save()` 直接 return（只读不写）；
    #       真正的落盘改走新的 `writeArchive()`（不经过 stash）。
    #       ⚠️ 同一个 bug 在**每次启动**都在跑：`load()` 里 `byContact` 刚读出来，
    #       紧接着 `broadcastSwitch` 就 `stash()` 拿空 `messages` 盖掉它 ——
    #       只是后面还有别的写入把它救回来了，平时看不出来。
    #    ② **`settings` 跨设备带授权**。`aevis.device.authorized`（这台设备过没过审）
    #       和 `aevis.account.*` 都在 `aevis.` 前缀里、也不含机密关键词，
    #       于是跟着包落到新手机上 —— 新机以为自己已经授权过了。
    #       加 `excludedPrefixes` 黑名单：`aevis.device.` / `aevis.account.` /
    #       `aevis.lastBackupName`。
    #    ③ 恢复收尾补 `syncActive()`：把 `currentID` 摆到搬过来的 `activeID` 上
    #       （导入期间只是没落盘，没重切的话界面还停在旧会话）。
    # 0.0.89 = 上一批 5 条：音乐/一起听、情侣空间、银行卡、通知「像她」、AI 权限。
    # ⚠️ 0.0.90（2026-09-30 晚）：
    #    ① **修「进后台锁屏 / 灵动岛上没有播放控件」**（用户实测报的
    #       「我去后台的时候系统的灵动岛上面和播放音乐圈没有」）。
    #       根因**不在界面**：`AVAudioSession` 全进程只有一个，而我们在
    #       三处都带了 `.mixWithOthers`（音乐 / TTS / QQ 静音保活）。
    #       只要带"可混音"，系统就认为你没打算独占音频通道 ——
    #       `MPNowPlayingInfoCenter` 全系统只有一个，它不知道该显示谁，
    #       于是**永远不会**把锁屏那套控件让给你。`duckOthers` 同理。
    #       修法：新增 `Core/AudioSession.swift` 统一管会话 ——
    #       音乐这一类是 `.playback` + `options: []`（**故意不带任何选项**）；
    #       TTS / 录音"谁借走谁还回来"（说话必须换 `.spokenAudio`、
    #       录音必须换 `.playAndRecord`，还的时候只要音乐还在放就还原）；
    #       QQ 保活在音乐播放时**一个字节都不动类别**；
    #       回到前台（`RootView.scenePhase == .active`）补一次。
    #       顺带补齐 `nowPlayingInfo`：封面（`MPMediaItemArtwork`，不能用
    #       `AsyncImage`）、`MediaType = audio`、时长不许为 0、
    #       锁屏进度条能拖（`changePlaybackPositionCommand`）、
    #       各命令显式 `isEnabled = true`。
    #       ⚠️ 也**不再**在 `MusicPlayer.init` 里抢会话了 —— 那等于 App 一启动
    #       就打断用户正在听的别的 App（旧的 `.mixWithOthers` 顺带掩盖了这件事）。
    #    ② **一起听里能互相打字**（用户原话：「我们不能两个人互相打字聊天，
    #       要加一个输入框，能互相打字聊天的」）。
    #       `PlayerView` 底部新增「打字聊」，弹一层 `ListenChatSheet`：
    #       气泡流式长字、输入框、点她的话就念出来。
    #       她那边由 `ListenTogetherService.send()` 走完整人设 + 工具 + 记忆，
    #       而且**两边的话都同步进正式聊天记录** —— 关掉播放器不会凭空消失。
    #    ③ 「AI 权限」那张卡补进截图清单（上一轮漏了）。
    # ⚠️ 版本号 CI **不会**自己改（workflow 里没有 run_number 那套），
    #    必须在这里手改，否则出的包还叫旧版本，装的时候会跟旧包撞版本。
    MARKETING_VERSION: "0.0.90"
    CURRENT_PROJECT_VERSION: "90"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_STRICT_CONCURRENCY: "minimal"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    AEVIS_COMMIT: "dev"

targets:
  # ——— 主 App ———

  Aevis:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Aevis
        excludes:
          - "Resources/Info.plist"
          # 权限声明文件是给签名用的，不该被当成资源打进包里
          - "Aevis.entitlements"
    # >>> extension-dep:start
    # 这一段和下面的 AevisBroadcast target 是**成对**的：
    # scripts/strip_extension.py 会按标记一起摘掉，用来在
    # 「嵌套扩展签不过、整个 App 装不上」时快速退回到纯 App。
    dependencies:
      - target: AevisBroadcast
        embed: true
    # <<< extension-dep:end
    settings:
      base:
        PRODUCT_NAME: Aevis
        PRODUCT_BUNDLE_IDENTIFIER: com.aevis.ios
        INFOPLIST_FILE: Aevis/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        # App Group（和扩展共用）—— 录屏靠它把文字传回主 App
        CODE_SIGN_ENTITLEMENTS: Aevis/Aevis.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 把 Assets 里所有 appiconset 都编进去，备用图标才能被
        # UIApplication.setAlternateIconName(_:) 找到
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"
      configs:
        # 显式定义 DEBUG，别依赖 Xcode 默认模板 ——
        # DemoSeed 里的 #if DEBUG 要靠它，CI 截图自检也靠它。
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_COMPILATION_MODE: "wholemodule"

  # >>> extension:start
  # ——— 系统录屏扩展 ———
  #
  # 它**不是**给用户点的界面，是给系统用的：开始录屏之后，收画面的是这个
  # 跑在独立进程里的扩展，所以切到微信、抖音也一直录得到。
  # 主 App 只管把启动它的系统控件摆出来。
  #
  # 它和主 App 之间**没有别的通道**，只能靠 App Group 传（见 ScreenShareStore）。
  AevisBroadcast:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Broadcast
        excludes:
          - "Info.plist"
          - "AevisBroadcast.entitlements"
      # 这两个文件**两个 target 都要编** —— 它们是两边的契约，只此一份
      - path: Aevis/Core/ScreenShareStore.swift
      - path: Aevis/Core/ExtensionLink.swift
    settings:
      base:
        PRODUCT_NAME: AevisBroadcast
        PRODUCT_BUNDLE_IDENTIFIER: com.aevis.ios.broadcast
        INFOPLIST_FILE: Broadcast/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: Broadcast/AevisBroadcast.entitlements
        SKIP_INSTALL: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_COMPILATION_MODE: "wholemodule"
  # <<< extension:end

  # ——— 管理端 App（**独立的包**，不塞进主 App）———
  #
  # 给管理员用的：看崩溃现场、发注册码、封设备/账号、批换机。
  # 和主 App 是两个包，各自装、各自更新 —— 管理端不必跟着买家版本走。
  # 手机用底栏、iPad 用侧栏（`AdminRootView` 里按 idiom 分）。
  #
  # ⚠️ 它在 `extension` 标记块**外面**：`strip_extension.py` 摘录屏扩展时
  #    只动标记之间的内容，管理端不会跟着被摘掉。
  AevisAdmin:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AevisAdmin
        excludes:
          - "Resources/Info.plist"
      # 钥匙串封装两个 App 共用**同一份** —— 它只依赖 Security，自包含。
      # （跟 AevisBroadcast 复用 ScreenShareStore 是一个套路：契约只此一份。）
      - path: Aevis/Core/Keychain.swift
      # 域名常量也共用同一份 —— 管理端和主 App 必须指向同一个后端，
      # 两边各写一遍的话，换域名时一定会漏一个（2026-09-26 就是这么发现的）。
      - path: Aevis/Core/AevisHosts.swift
      # 线路探测（线路一/线路二）同样共用：两个 App 必须用同一套"谁通走谁"的判断，
      # 否则会出现"主 App 走线路二、管理端走线路一"，排查时对不上号。
      - path: Aevis/Core/AccountEndpoint.swift
    settings:
      base:
        # ⭐⭐ **管理端的名字只有这一处**（它当模板用）。
        #
        # 桌面图标名（Info.plist 的 `CFBundleDisplayName`）、App 里所有标题
        # （登录页 / 导航栏 / 导出诊断的标题 —— 见 `AdminBrand.swift`）、
        # 以及签工具源里显示的名字（`build_webroot.py` 会来读这一行）
        # —— 全都从它派生。
        #
        # 换名字：`python tools/rename_admin.py 新名字`
        # （那个脚本改完会再扫一遍残留，确认没有别处还写死旧名字）
        ADMIN_BRAND: "Aevis"
        PRODUCT_NAME: AevisAdmin
        PRODUCT_BUNDLE_IDENTIFIER: com.aevis.admin
        INFOPLIST_FILE: AevisAdmin/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        # 管理端是**另一个 App**，版本号自己一套 —— 别跟主 App 的 0.0.x 混
        # （它给管理员用，更新节奏跟买家版本完全无关）
        # 1.0.3（2026-09-28）：订单可搜索 + 每个功能块都能收起
        # ⚠️ 2026-09-28 1.0.4：**冷启动自动拉数据** —— 以前钥匙串里有令牌就直接
        # 进主界面，一个请求都不发，所有列表是空的（用户报的「划掉后台重开就
        # 什么数据都没有」）。另外从后台切回来也会自动刷一次。
        MARKETING_VERSION: "1.0.5"
        CURRENT_PROJECT_VERSION: "6"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_COMPILATION_MODE: "wholemodule"

  # ——— VPN 探针（**体检用，不是功能**）———
  #
  # 只回答一个问题：**这套签名能不能跑网络扩展（VPN 隧道）**。
  # 「拦掉抖音域名、不用快捷指令」那条路，只有隧道能起来才谈得上。
  #
  # ⚠️ 三个刻意的安排：
  #   ① 它在 `extension` 标记块**外面** —— 走"摘掉录屏扩展"那条应急路时
  #      不会被连带摘掉（两者毫无关系）
  #   ② 主 App **不依赖**它 —— 探测失败绝不影响买家那个包
  #   ③ 它自己一个包（com.aevis.vpnprobe）—— 拿买家的包去赌扩展签名是不行的：
  #      扩展签不明白会**连装都装不上**
  AevisVPNProbe:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AevisVPNProbe/App
        excludes:
          - "Info.plist"
          - "AevisVPNProbe.entitlements"
    dependencies:
      - target: AevisVPNProbeTunnel
        embed: true
    settings:
      base:
        PRODUCT_NAME: AevisVPNProbe
        PRODUCT_BUNDLE_IDENTIFIER: com.aevis.vpnprobe
        INFOPLIST_FILE: AevisVPNProbe/App/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: AevisVPNProbe/App/AevisVPNProbe.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        # 探针是**一次性工具**，版本号自己一套，跟主 App 的 0.0.x 无关
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_COMPILATION_MODE: "wholemodule"

  # 隧道本体。跑在独立进程里，`PacketTunnelProvider` 就在这儿。
  # ⚠️ 它和上面那个 App **要签同一条权限**（networkextension）——
  #    缺任何一边隧道都起不来，这也是侧载重签时最容易翻车的地方。
  AevisVPNProbeTunnel:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AevisVPNProbe/Tunnel
        excludes:
          - "Info.plist"
          - "AevisVPNProbeTunnel.entitlements"
    settings:
      base:
        PRODUCT_NAME: AevisVPNProbeTunnel
        PRODUCT_BUNDLE_IDENTIFIER: com.aevis.vpnprobe.tunnel
        INFOPLIST_FILE: AevisVPNProbe/Tunnel/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: AevisVPNProbe/Tunnel/AevisVPNProbeTunnel.entitlements
        SKIP_INSTALL: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_COMPILATION_MODE: "wholemodule"

  # ——— 通话探针（2026-10-01）———
  #
  # 只回答一个问题：
  #   **这套签名（侧载重签之后），能不能弹系统级通话界面？**
  #
  # 背景：Apple 的 `LiveCommunicationKit`（iOS 17.4+，微信"语音通话用弹窗快捷接听"
  # 用的那个，就是用户问的"苹果那样的 LIVE"）有两条路 ——
  #   · 「收来电」**必须** PushKit VoIP 推送，没推送系统会**杀掉 App**
  #   · 「主动拨出」`StartConversationAction`**不要**推送
  # 我们这是"你拨给 TA"，走第二条。但它要求 App 有通话资格（`aps-environment`），
  # 而那句话必须写在**描述文件**里 —— 那是全能签给的，我们看不到也改不了。
  # **只能装上去真跑一次。**
  #
  # ⚠️ 三个刻意的安排（照抄 VPN 探针那套，理由一样）：
  #   ① 它在 `extension` 标记块**外面** —— 走"摘掉录屏扩展"那条应急路时
  #      不会被连带摘掉（两者毫无关系）
  #   ② 主 App **不依赖**它 —— 探测失败绝不影响买家那个包
  #   ③ 它自己一个包（com.aevis.callprobe）—— 探针要声明 aps-environment、
  #      加 voip 后台模式、动 entitlements，这些在买家包上做**有风险**
  #      （描述文件对不上连装都装不上），不能拿买家包去赌
  #
  # ⚠️ 它**不接真实通话**（3 秒自动挂断），只测"界面弹不弹"。
  # 要出探针 IPA：把 `.release/callprobe` 改成 1 再推。出完**人工**改回 0。
  AevisCallProbe:
    type: application
    platform: iOS
    # ⚠️ **17.4 不是 17.0** —— LiveCommunicationKit 整个框架都是 17.4 起步的。
    # 第一次写 17.0，CI 报了一屏 "is only available in iOS 17.4 or newer"。
    # 探针只在一台 iOS 26 的机器上跑，条件放宽没意义，索性按框架要求来。
    deploymentTarget: "17.4"
    sources:
      - path: AevisCallProbe/App
        excludes:
          - "Info.plist"
          - "AevisCallProbe.entitlements"
    settings:
      base:
        PRODUCT_NAME: AevisCallProbe
        PRODUCT_BUNDLE_IDENTIFIER: com.aevis.callprobe
        INFOPLIST_FILE: AevisCallProbe/App/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: AevisCallProbe/App/AevisCallProbe.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        # 探针是**一次性工具**，版本号自己一套，跟主 App 的 0.0.x 无关
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_COMPILATION_MODE: "wholemodule"

schemes:
  Aevis:
    build:
      targets:
        Aevis: all
        # >>> extension-scheme:start
        AevisBroadcast: all
        # <<< extension-scheme:end
    run:
      config: Debug
    archive:
      config: Release

  # 探针单独的 scheme —— 平时 CI 用 `-target` 编，这个是为了
  # 以后谁拿 Xcode 打开也能直接选中它跑。
  AevisVPNProbe:
    build:
      targets:
        AevisVPNProbe: all
        AevisVPNProbeTunnel: all
    run:
      config: Debug
    archive:
      config: Release

  AevisCallProbe:
    build:
      targets:
        AevisCallProbe: all
    run:
      config: Debug
    archive:
      config: Release
