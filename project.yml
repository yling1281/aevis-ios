name: Aevis

options:
  bundleIdPrefix: com.aevis
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    # ⚠️ 版本号要**单调递增**（用户靠它分辨新旧），而且**必须等于包内的真实版本** ——
    # 上次就是按"上一次成功的是 56、下一个该是 57"去推算，可那次推送因为
    # 连接器断线根本没触发构建 → 写成了 58、实际 tag 是 build-57。
    # 推之前先查一次 `GET /repos/.../actions/runs?per_page=1` 看真实的 N。
    #
    # ⚠️⚠️ 2026-09-26 又栽了一次，是**部署那一步**：build-60 的包里写的是 0.0.60，
    #   我却 `deploy_server.py 61 …` 去部署 → source.json 标成 0.0.61，
    #   而用户装到手机上看到的是 0.0.60。**部署脚本的第一个参数是"包里的版本号"，
    #   不是 run_number**（两者相等是靠每次都对上，不是自动的）。
    MARKETING_VERSION: "0.0.70"
    CURRENT_PROJECT_VERSION: "70"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_STRICT_CONCURRENCY: "minimal"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    AEVIS_COMMIT: "dev"

targets:
  # ——— 主 App ———

  Aevis:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Aevis
        excludes:
          - "Resources/Info.plist"
          # 权限声明文件是给签名用的，不该被当成资源打进包里
          - "Aevis.entitlements"
    # >>> extension-dep:start
    # 这一段和下面的 AevisBroadcast target 是**成对**的：
    # scripts/strip_extension.py 会按标记一起摘掉，用来在
    # 「嵌套扩展签不过、整个 App 装不上」时快速退回到纯 App。
    dependencies:
      - target: AevisBroadcast
        embed: true
    # <<< extension-dep:end
    settings:
      base:
        PRODUCT_NAME: Aevis
        PRODUCT_BUNDLE_IDENTIFIER: com.aevis.ios
        INFOPLIST_FILE: Aevis/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        # App Group（和扩展共用）—— 录屏靠它把文字传回主 App
        CODE_SIGN_ENTITLEMENTS: Aevis/Aevis.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 把 Assets 里所有 appiconset 都编进去，备用图标才能被
        # UIApplication.setAlternateIconName(_:) 找到
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"
      configs:
        # 显式定义 DEBUG，别依赖 Xcode 默认模板 ——
        # DemoSeed 里的 #if DEBUG 要靠它，CI 截图自检也靠它。
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_COMPILATION_MODE: "wholemodule"

  # >>> extension:start
  # ——— 系统录屏扩展 ———
  #
  # 它**不是**给用户点的界面，是给系统用的：开始录屏之后，收画面的是这个
  # 跑在独立进程里的扩展，所以切到微信、抖音也一直录得到。
  # 主 App 只管把启动它的系统控件摆出来。
  #
  # 它和主 App 之间**没有别的通道**，只能靠 App Group 传（见 ScreenShareStore）。
  AevisBroadcast:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Broadcast
        excludes:
          - "Info.plist"
          - "AevisBroadcast.entitlements"
      # 这两个文件**两个 target 都要编** —— 它们是两边的契约，只此一份
      - path: Aevis/Core/ScreenShareStore.swift
      - path: Aevis/Core/ExtensionLink.swift
    settings:
      base:
        PRODUCT_NAME: AevisBroadcast
        PRODUCT_BUNDLE_IDENTIFIER: com.aevis.ios.broadcast
        INFOPLIST_FILE: Broadcast/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: Broadcast/AevisBroadcast.entitlements
        SKIP_INSTALL: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_COMPILATION_MODE: "wholemodule"
  # <<< extension:end

  # ——— 管理端 App（**独立的包**，不塞进主 App）———
  #
  # 给管理员用的：看崩溃现场、发注册码、封设备/账号、批换机。
  # 和主 App 是两个包，各自装、各自更新 —— 管理端不必跟着买家版本走。
  # 手机用底栏、iPad 用侧栏（`AdminRootView` 里按 idiom 分）。
  #
  # ⚠️ 它在 `extension` 标记块**外面**：`strip_extension.py` 摘录屏扩展时
  #    只动标记之间的内容，管理端不会跟着被摘掉。
  AevisAdmin:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AevisAdmin
        excludes:
          - "Resources/Info.plist"
      # 钥匙串封装两个 App 共用**同一份** —— 它只依赖 Security，自包含。
      # （跟 AevisBroadcast 复用 ScreenShareStore 是一个套路：契约只此一份。）
      - path: Aevis/Core/Keychain.swift
    settings:
      base:
        PRODUCT_NAME: AevisAdmin
        PRODUCT_BUNDLE_IDENTIFIER: com.aevis.admin
        INFOPLIST_FILE: AevisAdmin/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        # 管理端是**另一个 App**，版本号自己一套 —— 别跟主 App 的 0.0.x 混
        # （它给管理员用，更新节奏跟买家版本完全无关）
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_COMPILATION_MODE: "wholemodule"

schemes:
  Aevis:
    build:
      targets:
        Aevis: all
        # >>> extension-scheme:start
        AevisBroadcast: all
        # <<< extension-scheme:end
    run:
      config: Debug
    archive:
      config: Release
