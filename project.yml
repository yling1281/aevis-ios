name: Aevis

options:
  bundleIdPrefix: com.aevis
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_STRICT_CONCURRENCY: "minimal"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    AEVIS_COMMIT: "dev"

targets:
  Aevis:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Aevis
        excludes:
          - "Resources/Info.plist"
    settings:
      base:
        PRODUCT_NAME: Aevis
        PRODUCT_BUNDLE_IDENTIFIER: com.aevis.ios
        INFOPLIST_FILE: Aevis/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 把 Assets 里所有 appiconset 都编进去，备用图标才能被
        # UIApplication.setAlternateIconName(_:) 找到
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"
      configs:
        # 显式定义 DEBUG，别依赖 Xcode 默认模板 ——
        # DemoSeed 里的 #if DEBUG 要靠它，CI 截图自检也靠它。
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_COMPILATION_MODE: "wholemodule"

schemes:
  Aevis:
    build:
      targets:
        Aevis: all
    run:
      config: Debug
    archive:
      config: Release
