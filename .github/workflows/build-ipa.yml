name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"
          echo "simulators:"
          xcrun simctl list devices available | grep -m 8 "iPhone" || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate app icon
        run: python3 scripts/make_icon.py Aevis/Resources

      - name: Generate Xcode project
        run: xcodegen generate

      # ——— 真机用的未签名包 ———

      - name: Build (device, unsigned)
        env:
          AEVIS_COMMIT: ${{ github.sha }}
        run: |
          set -o pipefail
          xcodebuild \
            -project Aevis.xcodeproj \
            -target Aevis \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            AEVIS_COMMIT="$AEVIS_COMMIT" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            > build.log 2>&1 || { echo "===== BUILD FAILED ====="; tail -n 200 build.log; exit 1; }
          echo "===== BUILD OK ====="
          tail -n 8 build.log

      - name: Package IPA
        if: success()
        run: |
          set -e
          APP="build/Release-iphoneos/Aevis.app"
          if [ ! -d "$APP" ]; then
            echo "找不到 Aevis.app，输出目录内容："
            find build -maxdepth 3 -name "*.app" -print
            exit 1
          fi

          rm -rf Payload Aevis-unsigned.ipa Aevis-adhoc.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/Aevis.app
          rm -rf Payload/Aevis.app/_CodeSignature
          rm -f Payload/Aevis.app/embedded.mobileprovision

          /usr/bin/zip -qry -X Aevis-unsigned.ipa Payload

          codesign -f -s - --deep Payload/Aevis.app || true
          /usr/bin/zip -qry -X Aevis-adhoc.ipa Payload

          ls -lh Aevis-unsigned.ipa Aevis-adhoc.ipa

      # ——— 模拟器自检：装进去、跑起来、截图 ———
      #
      # 这一步是为了「先自己看一眼再交给用户」，能拦住布局类的 bug
      # （比如元素被挤出屏幕、气泡对不齐）。交互类的 bug 拦不住，那需要真机。
      # 用 continue-on-error，截图失败也不影响出包。

      - name: Simulator screenshots
        if: success()
        continue-on-error: true
        env:
          AEVIS_COMMIT: ${{ github.sha }}
        run: |
          set -e
          echo "::group::构建模拟器版本"
          xcodebuild \
            -project Aevis.xcodeproj \
            -target Aevis \
            -configuration Debug \
            -sdk iphonesimulator \
            SYMROOT="$PWD/build-sim" \
            AEVIS_COMMIT="$AEVIS_COMMIT" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > sim-build.log 2>&1 || { echo "模拟器构建失败"; tail -n 100 sim-build.log; exit 1; }
          echo "::endgroup::"

          APP=$(ls -d build-sim/Debug-iphonesimulator/*.app | head -1)
          echo "APP=$APP"

          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone" | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          if [ -z "$UDID" ]; then
            UDID=$(xcrun simctl list devices available | grep -m1 -oE '\(([0-9A-F-]{36})\)' | tr -d '()')
          fi
          echo "UDID=$UDID"
          test -n "$UDID" || { echo "找不到可用模拟器"; xcrun simctl list devices available; exit 1; }

          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"

          mkdir -p shots
          capture () {
            name="$1"; shift
            echo "--- 截图 $name 参数: $* ---"
            xcrun simctl launch "$UDID" com.aevis.ios "$@" || true
            sleep 8
            xcrun simctl io "$UDID" screenshot "shots/$name.png" || true
            xcrun simctl terminate "$UDID" com.aevis.ios || true
            sleep 2
          }

          capture 01-onboarding
          capture 02-chat        -aevisDemo
          capture 03-noglass     -aevisDemo -aevisNoGlass
          capture 04-simple      -aevisDemo -aevisSimple
          capture 05-paper       -aevisDemo -aevisCustomBackground
          capture 06-settings    -aevisDemo -aevisOpenSettings

          echo "::group::截图结果"
          ls -lh shots/ || true
          echo "::endgroup::"

      # ——— 诊断与产物 ———

      - name: Ensure logs exist
        if: always()
        run: |
          touch build.log sim-build.log
          ls -lh *.log || true

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Aevis-build
          path: |
            Aevis-unsigned.ipa
            Aevis-adhoc.ipa
            shots/*.png
          retention-days: 30

      - name: Publish release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Aevis build ${{ github.run_number }}
          prerelease: true
          body: |
            Aevis 自动构建产物。

            - 提交：`${{ github.sha }}`
            - 工具链：macos-26 / Xcode 26.x

            **手机端安装**：下载 `Aevis-unsigned.ipa`，用「全能签」签名后安装。

            另外附上模拟器自检截图（`shots-*.png`）与构建日志（`build.log`、`sim-build.log`），
            方便排查。`Aevis-adhoc.ipa` 是已做 ad-hoc 签名的备用版本。
          files: |
            Aevis-unsigned.ipa
            Aevis-adhoc.ipa
            shots/*.png
            build.log
            sim-build.log

      # ——— 失败时把日志也公开出来，便于无 token 环境排查 ———

      - name: Publish build log when failing
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: log-${{ github.run_number }}
          name: 构建失败日志 run ${{ github.run_number }}
          prerelease: true
          body: |
            构建失败。完整日志见下方 Assets。
            提交：`${{ github.sha }}`
          files: |
            build.log
            sim-build.log
