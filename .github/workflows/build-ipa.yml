name: CI

# 每次推代码只做「编译 + 模拟器自检截图」，**不出 IPA**。
# 需要 IPA 时，把 .release/ipa 的内容改成 1 再推一次；
# 出完包后 workflow 会自动把它重置回 0（用 [skip ci] 避免死循环）。

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and self-check
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ——— 临时通道：从公网地址取源码 ———
      #
      # 为什么需要这一步：源码是在本地写的，而**推代码本身需要把每个文件的内容
      # 一起传上去**（连接器接口就是这样）。六十多个文件、六百多 KB，
      # 一口气传不动，拆成十几批又太慢。
      #
      # 所以改成：把源码打成包放到一个公开地址，让 CI 自己去取。
      # **这是临时的** —— 等源码用正常方式推上来之后，把 `.bootstrap-url` 删掉，
      # 这一步会自动跳过（下面有 if 判断）。
      #
      # 取回的东西已经验过：能下载、大小对、sha256 与本地一致、解压正常。

      - name: Bootstrap source (temporary)
        if: hashFiles('.bootstrap-url') != ''
        run: |
          set -e
          SRC_URL=$(tr -d ' \n\r' < .bootstrap-url)
          echo "从 $SRC_URL 取源码"

          curl -fsSL --retry 4 --retry-all-errors --retry-delay 3 \
            --max-time 300 -o "$RUNNER_TEMP/src.zip" "$SRC_URL"

          SIZE=$(wc -c < "$RUNNER_TEMP/src.zip")
          echo "拿到 $SIZE 字节"
          # 太小说明下载被截断，宁可直接失败也不要编一份半截代码
          test "$SIZE" -gt 200000 || { echo "源码包不完整"; exit 1; }

          rm -rf "$RUNNER_TEMP/src"
          mkdir -p "$RUNNER_TEMP/src"
          unzip -q "$RUNNER_TEMP/src.zip" -d "$RUNNER_TEMP/src"

          # 包里顶层就是 aevis-ios/，覆盖到工作区
          rsync -a "$RUNNER_TEMP/src/aevis-ios/" ./

          echo "覆盖完成，抽查几个新文件："
          wc -l Aevis/Core/ListenService.swift Aevis/Core/CallService.swift \
                Aevis/Features/Call/CallView.swift Aevis/Core/MemoryStore.swift
          echo "Swift 文件总数: $(find Aevis -name '*.swift' | wc -l)"
          echo "IPA 开关: $(cat .release/ipa)"

      # 取到源码后立刻把它提交回仓库，并删掉地址文件 —— 这一步很关键：
      # 1. 仓库从此就是完整的，别人 clone 下来能直接编；
      # 2. 临时通道自己关掉（`.bootstrap-url` 没了，上面的步骤下次就跳过）；
      # 3. **否则以后推的任何修复都会被包里的旧版本覆盖**，修 bug 的循环就断了。
      # 带 [skip ci] 避免自己触发自己。
      - name: Commit bootstrapped source back (temporary)
        if: hashFiles('.bootstrap-url') != ''
        run: |
          set -e
          rm -f .bootstrap-url
          git config user.name "aevis-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "没什么可提交的"
          else
            git commit -m "chore: 把取到的源码落回仓库，并关闭临时通道 [skip ci]"
            git push
            echo "已提交回仓库"
          fi

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Decide whether to package an IPA
        id: decide
        run: |
          REQ=$(tr -d ' \n\r' < .release/ipa 2>/dev/null || echo "0")
          if [ "$REQ" = "1" ]; then
            echo "should=yes" >> "$GITHUB_OUTPUT"
            echo "本次会出 IPA"
          else
            echo "should=no" >> "$GITHUB_OUTPUT"
            echo "本次只做自检，不出 IPA"
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate app icon
        run: python3 scripts/make_icon.py Aevis/Resources

      - name: Generate Xcode project
        run: xcodegen generate

      # ——— 编译真机版本：只为验证能编过，不出包 ———

      - name: Compile (device, unsigned)
        env:
          AEVIS_COMMIT: ${{ github.sha }}
        run: |
          set -o pipefail
          xcodebuild \
            -project Aevis.xcodeproj \
            -target Aevis \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            AEVIS_COMMIT="$AEVIS_COMMIT" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            > build.log 2>&1 || { echo "===== BUILD FAILED ====="; tail -n 200 build.log; exit 1; }
          echo "===== BUILD OK ====="
          tail -n 6 build.log

      # ——— 模拟器自检：装进去、跑起来、截图 ———
      #
      # 这是「交给人之前先自己看一眼」的那一步，能拦住布局类 bug
      # （元素被挤出屏幕、气泡错位、配色看不清）。
      # 交互类 bug 拦不住，那需要真机。

      - name: Simulator self-check
        if: success()
        continue-on-error: true
        env:
          AEVIS_COMMIT: ${{ github.sha }}
        run: |
          set -e
          xcodebuild \
            -project Aevis.xcodeproj \
            -target Aevis \
            -configuration Debug \
            -sdk iphonesimulator \
            SYMROOT="$PWD/build-sim" \
            AEVIS_COMMIT="$AEVIS_COMMIT" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > sim-build.log 2>&1 || { echo "模拟器构建失败"; tail -n 100 sim-build.log; exit 1; }

          APP=$(ls -d build-sim/Debug-iphonesimulator/*.app | head -1)
          echo "APP=$APP"

          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone" | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          if [ -z "$UDID" ]; then
            UDID=$(xcrun simctl list devices available | grep -m1 -oE '\(([0-9A-F-]{36})\)' | tr -d '()')
          fi
          test -n "$UDID" || { echo "找不到可用模拟器"; exit 1; }
          echo "UDID=$UDID"

          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"

          mkdir -p shots
          capture () {
            name="$1"; shift
            echo "--- 截图 $name 参数: $* ---"
            xcrun simctl launch "$UDID" com.aevis.ios "$@" || true
            sleep 8
            xcrun simctl io "$UDID" screenshot "shots/$name.png" || true
            xcrun simctl terminate "$UDID" com.aevis.ios || true
            sleep 2
          }

          capture 01-onboarding
          capture 02-chat        -aevisDemo
          capture 03-noglass     -aevisDemo -aevisNoGlass
          capture 04-simple      -aevisDemo -aevisSimple
          capture 05-paper       -aevisDemo -aevisCustomBackground
          # 设置页太长一屏截不全 —— -aevisSettingsFocus 每次只显示一张卡
          capture 06-bubbles     -aevisDemo -aevisOpenSettings -aevisSettingsFocus=bubbles
          capture 07-memory      -aevisDemo -aevisOpenSettings -aevisSettingsFocus=memory
          capture 08-myprofile   -aevisDemo -aevisOpenSettings -aevisSettingsFocus=myprofile
          capture 09-model       -aevisDemo -aevisOpenSettings -aevisSettingsFocus=model
          capture 10-memory-list -aevisDemo -aevisOpenSettings -aevisSettingsFocus=memory -aevisOpenMemoryList
          capture 11-moments     -aevisDemo -aevisOpenMoments
          capture 12-moments-set -aevisDemo -aevisOpenSettings -aevisSettingsFocus=moments
          capture 13-together    -aevisDemo -aevisOpenTogether
          capture 14-companion   -aevisDemo -aevisOpenSettings -aevisSettingsFocus=companion
          capture 15-douyin      -aevisDemo -aevisOpenSettings -aevisSettingsFocus=douyin
          capture 16-system      -aevisDemo -aevisOpenSettings -aevisSettingsFocus=system
          capture 17-music       -aevisDemo -aevisOpenSettings -aevisSettingsFocus=music
          capture 18-selfcheck   -aevisSelfCheck

          ls -lh shots/ || true

      - name: Ensure logs exist
        if: always()
        run: |
          touch build.log sim-build.log
          ls -lh *.log || true

      # ——— 出 IPA（只在被要求时） ———

      - name: Package IPA
        if: steps.decide.outputs.should == 'yes'
        run: |
          set -e
          APP="build/Release-iphoneos/Aevis.app"
          test -d "$APP" || { echo "找不到 Aevis.app"; exit 1; }

          rm -rf Payload Aevis-unsigned.ipa Aevis-adhoc.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/Aevis.app
          rm -rf Payload/Aevis.app/_CodeSignature
          rm -f Payload/Aevis.app/embedded.mobileprovision

          /usr/bin/zip -qry -X Aevis-unsigned.ipa Payload

          codesign -f -s - --deep Payload/Aevis.app || true
          /usr/bin/zip -qry -X Aevis-adhoc.ipa Payload

          ls -lh Aevis-unsigned.ipa Aevis-adhoc.ipa

      - name: Publish IPA release
        if: steps.decide.outputs.should == 'yes'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Aevis ${{ github.run_number }}
          prerelease: true
          body: |
            Aevis 安装包。

            - 提交：`${{ github.sha }}`
            - 安装：下载 `Aevis-unsigned.ipa`，用「全能签」签名后安装

            同一次的自检截图与构建日志也在这里。
          files: |
            Aevis-unsigned.ipa
            Aevis-adhoc.ipa
            shots/*.png
            build.log
            sim-build.log

      - name: Publish self-check release
        if: steps.decide.outputs.should != 'yes'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: check-${{ github.run_number }}
          name: 自检 ${{ github.run_number }}
          prerelease: true
          body: |
            仅自检，**不含 IPA**。

            - 提交：`${{ github.sha }}`
            - 内容：模拟器启动截图 + 构建日志
          files: |
            shots/*.png
            build.log
            sim-build.log

      - name: Reset IPA request flag
        if: steps.decide.outputs.should == 'yes'
        run: |
          printf '0\n' > .release/ipa
          git config user.name "aevis-bot"
          git config user.email "bot@users.noreply.github.com"
          git add .release/ipa
          git commit -m "chore: 重置 IPA 请求标记 [skip ci]" || true
          git push || true

      - name: Publish logs when failing
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: log-${{ github.run_number }}
          name: 失败日志 ${{ github.run_number }}
          prerelease: true
          body: |
            构建失败。完整日志见下方 Assets。
            提交：`${{ github.sha }}`
          files: |
            build.log
            sim-build.log
