name: CI

# 每次推代码只做「编译 + 模拟器自检截图」，**不出 IPA**。
# 需要 IPA 时，推一个以 `ipa-` 开头的 tag（如 `ipa-2026-10-19`），
# 或把 .release/ipa 的内容改成 1 / true / yes / on 再推一次 —— 都会出包。
# 出完包后 workflow 会自动把 .release/ipa 重置回 0（用 [skip ci] 避免死循环）。
#
# ⚠️ 为什么要加 tag 触发、为什么开关还认字母（2026-10-19）：
#   推文件时 `content` 传裸 `1` 会被某些接口当成整数而拒绝
#   （`type: 1 has type "integer", want "string"`），
#   而且**加前导/尾随空格也救不了**（参数解析会把空白吃掉）。
#   ⇒ ① tag 触发：推 tag 不传文件内容，完全绕开；
#     ② 开关额外认 `true` / `yes` / `on`：这些是纯字母，能正常当字符串传。
#   两条路都留着，以后想用哪种都行。

on:
  push:
    branches: [ main ]
    tags: [ 'ipa-*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and self-check
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ——— 临时通道：从公网地址取源码 ———
      #
      # 为什么需要这一步：源码是在本地写的，而**推代码本身需要把每个文件的内容
      # 一起传上去**（连接器接口就是这样）。六十多个文件、六百多 KB，
      # 一口气传不动，拆成十几批又太慢。
      #
      # 所以改成：把源码打成包放到一个公开地址，让 CI 自己去取。
      # **这是临时的** —— 等源码用正常方式推上来之后，把 `.bootstrap-url` 删掉，
      # 这一步会自动跳过（下面有 if 判断）。

      - name: Bootstrap source (temporary)
        if: hashFiles('.bootstrap-url') != ''
        run: |
          set -e
          SRC_URL=$(tr -d ' \n\r' < .bootstrap-url)
          echo "从 $SRC_URL 取源码"

          curl -fsSL --retry 4 --retry-all-errors --retry-delay 3 \
            --max-time 300 -o "$RUNNER_TEMP/src.zip" "$SRC_URL"

          SIZE=$(wc -c < "$RUNNER_TEMP/src.zip")
          echo "拿到 $SIZE 字节"
          # 太小说明下载被截断，宁可直接失败也不要编一份半截代码
          test "$SIZE" -gt 200000 || { echo "源码包不完整"; exit 1; }

          rm -rf "$RUNNER_TEMP/src"
          mkdir -p "$RUNNER_TEMP/src"
          unzip -q "$RUNNER_TEMP/src.zip" -d "$RUNNER_TEMP/src"

          # 包里顶层就是 aevis-ios/，覆盖到工作区
          rsync -a "$RUNNER_TEMP/src/aevis-ios/" ./

          echo "覆盖完成，抽查几个新文件："
          wc -l Aevis/Core/ListenService.swift Aevis/Core/CallService.swift \
                Aevis/Features/Call/CallView.swift Aevis/Core/MemoryStore.swift
          echo "Swift 文件总数: $(find Aevis -name '*.swift' | wc -l)"
          echo "IPA 开关: $(cat .release/ipa)"

      # 取到源码后立刻把它提交回仓库，并删掉地址文件 —— 这一步很关键：
      # 1. 仓库从此就是完整的，别人 clone 下来能直接编；
      # 2. 临时通道自己关掉（`.bootstrap-url` 没了，上面的步骤下次就跳过）；
      # 3. **否则以后推的任何修复都会被包里的旧版本覆盖**，修 bug 的循环就断了。
      # 带 [skip ci] 避免自己触发自己。
      - name: Commit bootstrapped source back (temporary)
        if: hashFiles('.bootstrap-url') != ''
        run: |
          set -e
          rm -f .bootstrap-url
          git config user.name "aevis-bot"
          git config user.email "bot@users.noreply.github.com"

          # ⚠️ 一定要把 .github 排除在暂存区之外。
          #
          # CI 里的 GITHUB_TOKEN **没有 workflows 权限**：暂存区只要带了
          # `.github/workflows` 下的任何改动，整个 push 都会被 GitHub 拒绝，
          # 报 "refusing to allow a GitHub App to create or update workflow"。
          #
          # 这一步的目的只是「把源码落回仓库」，流水线文件本来就在仓库里，
          # 由正常的推送去更新它。
          git add -A
          git reset -q .github || true

          if git diff --cached --quiet; then
            echo "没什么可提交的"
          else
            git commit -m "chore: 把取到的源码落回仓库，并关闭临时通道 [skip ci]"
            if git push > git-push.log 2>&1; then
              echo "已提交回仓库"
            else
              echo "===== 推送失败（原因见下） ====="
              cat git-push.log
              exit 1
            fi
          fi

      # ——— 应用 patches/ 里的改动 ———
      #
      # 为什么需要这一步：`AppSettings.swift`（78KB）、`SettingsView.swift`（42KB）
      # 太大，推代码时只能整文件覆盖，而连接器接口塞不进这么大的内容 ——
      # 所以那几处改动做成了 `patches/*.patch`。**仓库里的源码仍是改之前的版本**，
      # 不打补丁就编译，出来的包没有主题色改动、没有云端卡片、没有新登录页。
      #
      # ⚠️ 顺序死线：**必须在 `xcodegen generate` 之前**，也必须在所有 build 之前。
      # ⚠️ 脚本失败**不许静默继续** —— 静默的话会编出一个「看起来成功、
      #    其实少了一半功能」的包，比直接红更难查。所以下面 `exit 1`。
      - name: Apply patches
        if: hashFiles('patches/apply_patches.sh') != ''
        run: |
          set -e
          bash patches/apply_patches.sh
          echo "打补丁后抽查："
          # 三个计数必须都 > 0，否则说明补丁没真正落地
          N1=$(grep -c 'case .aevis' Aevis/Core/AppSettings.swift || true)
          N2=$(grep -c 'CloudCard' Aevis/Features/Settings/SettingsView.swift || true)
          N3=$(grep -c 'thirdPartyRow' Aevis/Features/Login/LoginView.swift || true)
          echo "aevis 预设=$N1  CloudCard=$N2  第三方入口=$N3"
          test "$N1" -gt 0 || { echo "::error::PATCH| AppSettings 的 aevis 预设没打上"; exit 1; }
          test "$N2" -gt 0 || { echo "::error::PATCH| 设置页没注册 CloudCard"; exit 1; }
          test "$N3" -gt 0 || { echo "::error::PATCH| 登录页的圆形入口没打上"; exit 1; }

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Decide whether to package an IPA
        id: decide
        run: |
          REQ=$(tr -d ' \n\r' < .release/ipa 2>/dev/null || echo "0")
          # ⚠️ 认字母是**故意的**：推文件接口会把裸 `1` 当成整数而拒绝
          #    （`type: 1 has type "integer", want "string"`），加空格也救不了。
          #    所以 `true` / `yes` / `on` 这些纯字母串才是能推上去的形式。
          # tag 触发（`ipa-*`）同样算出包，见文件头。
          case "$REQ" in
            1|true|yes|on) WANT=yes ;;
            *)             WANT=no  ;;
          esac
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then WANT=yes; fi
          if [ "$WANT" = "yes" ]; then
            echo "should=yes" >> "$GITHUB_OUTPUT"
            echo "本次会出 IPA（开关=$REQ ref=$GITHUB_REF）"
          else
            echo "should=no" >> "$GITHUB_OUTPUT"
            echo "本次只做自检，不出 IPA"
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      # ——— 取「内置真 Linux」的 vendor 产物并铺好 ———
      #
      # 这两样**不在仓库里**（静态库 / 头文件是生成物，推不上来）——
      # 由 `ish-sandbox.yml` 编好后发成 Release，这里下载、校验、铺到本地。
      #
      # ⚠️ 顺序死线：**必须在 `xcodegen generate` 之前**（也在所有 build 之前）。
      #    `project.yml` 配了 `HEADER_SEARCH_PATHS` / `LIBRARY_SEARCH_PATHS`
      #    指向 `vendor/ish` 并链 `-laevisish`；目录不在时 xcodegen 之后必然编不过。
      # ⚠️ 失败一律 `exit 1`，**不许静默继续**。
      - name: Fetch iSH vendor (libaevisish.a + rootfs)
        # ⚠️ 必须显式给 gh 传 token：`gh` **不会**自己拿到 GITHUB_TOKEN
        #    （runner 上根本没有这个环境变量），不传的话
        #    `gh release view` / `gh release list` 全部失败。
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DEST="/tmp/ishvendor"
          rm -rf "$DEST"; mkdir -p "$DEST"

          # —— 取源：固定 tag 优先；缺失时回退到「编号最大的 ish-sandbox-macos-*」
          VENDOR_TAG="ish-vendor"
          SRC="fixed"
          if ! gh release view "$VENDOR_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            SRC="fallback"
            # ⚠️ 用 `--json tagName`，**不要**靠默认表格的 `$1`
            #    （第一列是 TITLE 不是 TAG，列顺序还是 gh 的内部实现、会变）。
            VENDOR_TAG=$(gh release list --repo "${{ github.repository }}" --limit 300 \
              --json tagName --jq '.[].tagName' \
              | awk '/^ish-sandbox-macos-/ { n=$1; sub(/^ish-sandbox-macos-/,"",n); if (n+0 > best) { best=n+0; tag=$1 } } END { print tag }')
            if [ -z "$VENDOR_TAG" ]; then
              echo "::error::VENDOR| 既没有固定 tag ish-vendor，也没有任何 ish-sandbox-macos-* release"
              exit 1
            fi
            echo "::warning::VENDOR| 固定 tag ish-vendor 不存在，回退到 $VENDOR_TAG"
          fi
          echo "VENDOR-SOURCE| tag=$VENDOR_TAG source=$SRC"

          # 1) 下载
          gh release download "$VENDOR_TAG" --repo "${{ github.repository }}" \
            --pattern 'ish-vendor.tar.gz' --pattern 'vendor.sha256' \
            --dir "$DEST" --clobber \
            || { echo "::error::VENDOR| 从 $VENDOR_TAG 下载失败"; exit 1; }

          # 2) 校验 tarball 自身 —— 这是防「下载到半截」的唯一手段
          grep ' ish-vendor.tar.gz$' "$DEST/vendor.sha256" > "$DEST/tar.sha256" \
            || { echo "::error::VENDOR| vendor.sha256 里没有 tarball 那一行"; exit 1; }
          ( cd "$DEST" && shasum -a 256 -c tar.sha256 ) \
            || { echo "::error::VENDOR| tarball 的 sha256 校验失败"; exit 1; }

          # 3) 解包
          rm -rf vendor/ish; mkdir -p vendor/ish
          tar xzf "$DEST/ish-vendor.tar.gz" -C vendor/ish

          # 3b) 内容体检：回退到旧格式的包时在这里就报清楚，别编到链接期才炸
          for f in libaevisish.a ish_embed.h; do
            [ -f "vendor/ish/$f" ] \
              || { echo "::error::VENDOR| vendor 包里缺 $f（来源 $VENDOR_TAG / $SRC）"; exit 1; }
          done

          # 4) 逐文件校验
          #    ⚠️ 必须滤掉 `#` 开头的说明行：vendor.sha256 第一行是中文注释，
          #       它既不是 tarball 那行、也不是校验行 —— 留着会被 `shasum -c` 判成格式不对。
          grep -v ' ish-vendor.tar.gz$' "$DEST/vendor.sha256" | grep -v '^#' > "$DEST/files.sha256"
          ( cd vendor/ish && shasum -a 256 -c "$DEST/files.sha256" ) \
            || { echo "::error::VENDOR| vendor 包内文件的 sha256 校验失败"; exit 1; }

          # 5) rootfs 解压（要的是 data/ + meta.db 顶层，不要再套一层）
          rm -rf ish-rootfs; mkdir -p ish-rootfs
          unzip -q vendor/ish/alpine-rootfs.zip -d ish-rootfs

          # 6) 目录非空自查
          { test -d vendor/ish && [ -n "$(ls -A vendor/ish 2>/dev/null)" ]; } \
            || { echo "::error::VENDOR| vendor/ish 不存在或为空"; exit 1; }
          { test -d ish-rootfs && [ -n "$(ls -A ish-rootfs 2>/dev/null)" ]; } \
            || { echo "::error::VENDOR| ish-rootfs 不存在或为空"; exit 1; }

          # 7) 可追溯信息写进 job summary
          NSHA=$(shasum -a 256 vendor/ish/libaevisish.a | cut -d' ' -f1 | cut -c1-16)
          NFILES=$(find ish-rootfs -type f | wc -l | tr -d ' ')
          {
            echo "## iSH vendor"
            echo ""
            echo "- 取源: tag=\`$VENDOR_TAG\`  source=$SRC"
            echo "- libaevisish.a sha256[:16]: \`$NSHA\`"
            echo "- rootfs 解压后文件数: $NFILES"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "vendor 就绪：libaevisish.a=$NSHA  rootfs 文件数=$NFILES"

      - name: Generate app icon
        run: python3 scripts/make_icon.py Aevis/Resources

      # 一键摘除录屏扩展的应急口子。
      #
      # 扩展是**嵌进主 App 的独立 target**，比主 App 多一套签名要求。
      # 我们的 IPA 是在手机上用第三方工具重签的 —— 万一那个工具处理不了
      # 嵌套的 .appex，**整个 App 会装不上**（iOS 的行为：嵌套 bundle
      # 签名不合格就不允许安装，不是"扩展不可用"）。
      #
      # 那种情况只要在仓库根放一个 `.release/no-extension`、重推一次，
      # 这里就会生成一份不含扩展的工程 —— 一条推送就能退回去。
      - name: Maybe strip the screen-recording extension
        run: python3 scripts/strip_extension.py

      # 把 Secrets 里的凭据就地写进 BuiltInSecrets.swift，让包内自带。
      #
      # ⚠️ 位置很讲究：**必须排在所有 git commit / push 步骤之后** ——
      # 这一步是就地把文件改掉，要是排在提交之前，真值会被提交回公开仓库。
      # 没配 Secrets 时脚本什么都不做（保持空值），编译照常。
      - name: Inject built-in credentials
        env:
          AEVIS_BAIDU_APP_KEY: ${{ secrets.AEVIS_BAIDU_APP_KEY }}
          AEVIS_BAIDU_SECRET_KEY: ${{ secrets.AEVIS_BAIDU_SECRET_KEY }}
          AEVIS_ACCOUNT_BOT_KEY: ${{ secrets.AEVIS_ACCOUNT_BOT_KEY }}
        run: python3 scripts/inject_secrets.py

      - name: Generate Xcode project
        run: xcodegen generate

      # ——— 编译真机版本 ———

      - name: Compile (device, unsigned)
        env:
          AEVIS_COMMIT: ${{ github.sha }}
        run: |
          set -o pipefail
          xcodebuild \
            -project Aevis.xcodeproj \
            -target Aevis \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            AEVIS_COMMIT="$AEVIS_COMMIT" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            > build.log 2>&1 || { echo "===== BUILD FAILED ====="; tail -n 200 build.log; exit 1; }
          echo "===== BUILD OK ====="
          tail -n 6 build.log

      # ——— 模拟器自检：装进去、跑起来、截图 ———
      #
      # 这是「交给人之前先自己看一眼」的那一步，能拦住布局类 bug。

      # ⚠️ **出包时整步跳过**（2026-10-19 加的，之前栽过）：
      #    这一步要按 `.github/shots.txt` 逐屏启动 App 截图（现在 52 条），
      #    每条 launch + sleep 8 + screenshot + terminate + sleep 2 ≈ 10 秒，
      #    加上模拟器冷启动和 Debug 构建，**实测把run #215 拖到 27 分钟还没完**，
      #    而 `Package IPA` 排在它后面 ⇒ 包出得很晚，甚至撞 60 分钟上限被砍。
      #    ⇒ 判定加一个「这次不要包」；平时推代码照旧自检，不影响看界面。
      #    想两者都要：在 want=yes 的那轮把下面这行的条件去掉即可。
      - name: Simulator self-check
        if: success() && steps.decide.outputs.should != 'yes'
        continue-on-error: true
        env:
          AEVIS_COMMIT: ${{ github.sha }}
        run: |
          set -e
          xcodebuild \
            -project Aevis.xcodeproj \
            -target Aevis \
            -configuration Debug \
            -sdk iphonesimulator \
            SYMROOT="$PWD/build-sim" \
            AEVIS_COMMIT="$AEVIS_COMMIT" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > sim-build.log 2>&1 || { echo "模拟器构建失败"; tail -n 100 sim-build.log; exit 1; }

          APP=$(ls -d build-sim/Debug-iphonesimulator/*.app | head -1)
          echo "APP=$APP"

          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone" | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          if [ -z "$UDID" ]; then
            UDID=$(xcrun simctl list devices available | grep -m1 -oE '\(([0-9A-F-]{36})\)' | tr -d '()')
          fi
          test -n "$UDID" || { echo "找不到可用模拟器"; exit 1; }
          echo "UDID=$UDID"

          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"

          mkdir -p shots
          capture () {
            name="$1"; shift
            echo "--- 截图 $name 参数: $* ---"
            xcrun simctl launch "$UDID" com.aevis.ios "$@" || true
            sleep 8
            xcrun simctl io "$UDID" screenshot "shots/$name.png" || true
            xcrun simctl terminate "$UDID" com.aevis.ios || true
            sleep 2
          }

          # 截图清单放在 .github/shots.txt 里，不写死在这 ——
          # 以后加界面只要推那个几百字节的小文件，不用动 workflow。
          if [ -f .github/shots.txt ]; then
            while IFS= read -r line; do
              case "$line" in
                ''|'#'*) continue ;;
              esac
              capture $line
            done < .github/shots.txt
          else
            echo "没有 .github/shots.txt，这次不截图"
          fi

          ls -lh shots/ || true

      - name: Ensure logs exist
        if: always()
        run: |
          # ⚠️ 每个日志文件都必须**有内容**。
          #
          # GitHub 不接受 0 字节的发布资产（报 "size must be greater than or
          # equal to 1"）。files 里只要有一个空文件，**整个「发布失败日志」
          # 都会失败** —— 结果就是编译错误一个都看不到，只能靠推理去猜。
          for f in build.log sim-build.log git-push.log; do
            if [ ! -s "$f" ]; then
              echo "（这一步没有产生内容）" > "$f"
            fi
          done
          ls -lh *.log || true

      # 把编译错误挑出来写进一个文件，发布时直接当 release 正文显示。
      - name: Collect failure info
        if: failure()
        run: |
          {
            echo "构建失败。"
            echo ""
            echo '提交：`${{ github.sha }}`'
            echo ""
            echo "## 编译错误"
            echo ""
            echo '```'
            grep -E "error:" build.log 2>/dev/null | head -60 || true
            grep -q "error:" build.log 2>/dev/null \
              || echo "（build.log 里没有 error: 行 —— 可能挂在编译之前的步骤）"
          } > errors.txt
          cat errors.txt

          # 再把编译错误以 workflow 命令的形式发一遍 ——
          # Annotations 区域**不需要鉴权就能读到**。
          grep -E "error:" build.log 2>/dev/null | head -15 | while IFS= read -r line; do
            echo "::error::$line"
          done

      # ——— 出 IPA（只在被要求时） ———

      - name: Package IPA
        if: steps.decide.outputs.should == 'yes'
        run: |
          set -e
          APP="build/Release-iphoneos/Aevis.app"
          test -d "$APP" || { echo "找不到 Aevis.app"; exit 1; }

          rm -rf Payload Aevis-unsigned.ipa Aevis-adhoc.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/Aevis.app
          rm -rf Payload/Aevis.app/_CodeSignature
          rm -f Payload/Aevis.app/embedded.mobileprovision

          /usr/bin/zip -qry -X Aevis-unsigned.ipa Payload

          codesign -f -s - --deep Payload/Aevis.app || true
          /usr/bin/zip -qry -X Aevis-adhoc.ipa Payload

          # 扩展是不是真的被嵌进去了。
          #
          # 没嵌进去的话，装到手机上**不会有「Aevis 录屏」这一项**，而界面不会报任何错。
          # ⚠️ 要**逐个**打注册点（现在 PlugIns 里有**两个** appex）。
          if [ -d Payload/Aevis.app/PlugIns ]; then
            echo "内嵌扩展："
            ls -1 Payload/Aevis.app/PlugIns/
            APPEXES=$(ls -d Payload/Aevis.app/PlugIns/*.appex 2>/dev/null || true)
            if [ -n "$APPEXES" ]; then
              for APPEX in $APPEXES; do
                echo "扩展注册点（$(basename "$APPEX")）："
                /usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPointIdentifier" \
                  "$APPEX/Info.plist" 2>/dev/null || echo "  （读不到，Info.plist 可能有问题）"
              done
            fi
          else
            echo "没有 PlugIns 目录 —— 这次没有嵌任何扩展"
          fi

          ls -lh Aevis-unsigned.ipa Aevis-adhoc.ipa

      - name: Publish IPA release
        if: steps.decide.outputs.should == 'yes'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Aevis ${{ github.run_number }}
          prerelease: true
          body: |
            Aevis 安装包。

            - 提交：`${{ github.sha }}`
            - 安装：下载 `Aevis-unsigned.ipa`，用「全能签」签名后安装
          files: |
            Aevis-unsigned.ipa
            Aevis-adhoc.ipa
            build.log

      - name: Publish self-check release
        if: steps.decide.outputs.should != 'yes'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: check-${{ github.run_number }}
          name: 自检 ${{ github.run_number }}
          prerelease: true
          body: |
            仅自检，**不含 IPA**。

            - 提交：`${{ github.sha }}`
            - 内容：模拟器启动截图 + 构建日志
          files: |
            shots/*.png
            build.log
            sim-build.log

      - name: Reset IPA request flag
        if: steps.decide.outputs.should == 'yes' && hashFiles('.bootstrap-url') == '' && github.ref == 'refs/heads/main'
        run: |
          printf '0\n' > .release/ipa
          git config user.name "aevis-bot"
          git config user.email "bot@users.noreply.github.com"
          git add .release/ipa
          git commit -m "chore: 重置 IPA 请求标记 [skip ci]" || true
          git push || true

      - name: Publish logs when failing
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: log-${{ github.run_number }}
          name: 失败日志 ${{ github.run_number }}
          prerelease: true
          body_path: errors.txt
          files: |
            errors.txt
            build.log
            sim-build.log
            git-push.log