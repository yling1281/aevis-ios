name: CallProbe

# 通话探针的流水线 —— **一次性工具**，跟买家那个包、跟管理端、跟 VPN 探针都无关。
#
# 它回答的问题只有一个：
#   **这套签名（侧载重签之后），能不能弹系统级的通话界面？**
#   也就是 Apple 的 LiveCommunicationKit（iOS 17.4+，微信"语音通话用弹窗
#   快捷接听"用的那个）里「主动拨出」那条路，在侧载包上到底通不通。
#
# 为什么单开一条：探针编不过绝不能拖累买家的包和管理端。
#
# ⚠️ 它**自己做 bootstrap（源码引导）**，理由和 VPN 探针那条一模一样 ——
#    是个**竞态**：探针源码进来要靠"落回仓库"那一步，而那是**主流水线**负责的；
#    两条流水线同时被同一次 push 触发，谁先谁后没保证。
#    不自己取一次，就可能"探针先跑 → 仓库里还没有源码 → 整轮跳过（而且是绿的）"。
#
#    ⚠️ 但 bootstrap 会 **rsync 覆盖**：`.bootstrap-url` 指向的包里要是没有探针
#    （比如那是个买家版的源码包），它会把 `project.yml` 盖回旧版、target 就没了。
#    所以下面的门禁**三样都查**（两个源文件 + project.yml 里有没有这个 target），
#    缺任何一样就整轮跳过 —— 而不是编到一半报"找不到 target"（那报错会误导人）。
#
# ⚠️ 它**不 push 仓库**（跟 admin.yml 一个教训：两条流水线都写仓库必然撞车）。
#    `contents: write` 留着是给 action-gh-release 建 release 用的。
#
# 要出探针 IPA：把 `.release/callprobe` 改成 1 再推。出完**人工**改回 0。

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  callprobe:
    name: Build call probe
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap source (temporary)
        if: hashFiles('.bootstrap-url') != ''
        run: |
          set -e
          SRC_URL=$(tr -d ' \n\r' < .bootstrap-url)
          echo "从 $SRC_URL 取源码"
          curl -fsSL --retry 4 --retry-all-errors --retry-delay 3 \
            --max-time 300 -o "$RUNNER_TEMP/src.zip" "$SRC_URL"
          SIZE=$(wc -c < "$RUNNER_TEMP/src.zip")
          echo "拿到 $SIZE 字节"
          test "$SIZE" -gt 200000 || { echo "源码包不完整"; exit 1; }
          rm -rf "$RUNNER_TEMP/src"
          mkdir -p "$RUNNER_TEMP/src"
          unzip -q "$RUNNER_TEMP/src.zip" -d "$RUNNER_TEMP/src"
          rsync -a "$RUNNER_TEMP/src/aevis-ios/" ./
          echo "探针 Swift 文件: $(find AevisCallProbe -name '*.swift' 2>/dev/null | wc -l)"

      # ⚠️ 门禁要**三样都查**，缺一不可：
      #    两个源文件 + **project.yml 里那个 target**。
      #    只查源文件是不够的 —— 实测过的坑：`.bootstrap-url` 指向的包里要是没有探针
      #    （比如那是个买家版的源码包），rsync 会把 project.yml **盖回旧版**，
      #    target 就没了。那种情况要**整轮跳过**，而不是编到一半报"找不到 target"。
      - name: Check whether the probe sources are here
        id: gate
        run: |
          if [ -f AevisCallProbe/App/CallProbeApp.swift ] \
             && [ -f AevisCallProbe/App/CallProbeModel.swift ] \
             && grep -q '^  AevisCallProbe:' project.yml; then
            echo "go=yes" >> "$GITHUB_OUTPUT"
            echo "探针源码和 target 都在，继续。"
          else
            echo "go=no" >> "$GITHUB_OUTPUT"
            echo "缺少探针源码或 project.yml 里没有这个 target，这一轮跳过。"
          fi

      - name: Decide whether to package an IPA
        id: decide
        if: steps.gate.outputs.go == 'yes'
        run: |
          REQ=$(tr -d ' \n\r' < .release/callprobe 2>/dev/null || echo "0")
          if [ "$REQ" = "1" ]; then
            echo "should=yes" >> "$GITHUB_OUTPUT"
            echo "本次会出探针 IPA"
          else
            echo "should=no" >> "$GITHUB_OUTPUT"
            echo "本次只验证能编过，不出 IPA"
          fi

      - name: Show toolchain
        if: steps.gate.outputs.go == 'yes'
        run: |
          xcodebuild -version
          echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Install XcodeGen
        if: steps.gate.outputs.go == 'yes'
        run: brew install xcodegen

      - name: Generate Xcode project
        if: steps.gate.outputs.go == 'yes'
        run: xcodegen generate

      # ——— 真机编译 ———
      #
      # ⚠️ 这一步是**探针最可能翻车的地方**：
      #    `LiveCommunicationKit` 是 iOS 17.4+ 才有的框架，
      #    而本工程的 deploymentTarget 是 17.0。所以源文件里
      #    `import LiveCommunicationKit` 在没有 `@available` 保护时
      #    会直接编译报错 —— 这里编译不过就是"框架用不了"的**第一条证据**，
      #    而且它是有意义的证据（说明这条路要抬 deploymentTarget）。
      - name: Compile (device, unsigned)
        if: steps.gate.outputs.go == 'yes'
        env:
          AEVIS_COMMIT: ${{ github.sha }}
        run: |
          set -o pipefail
          xcodebuild \
            -project Aevis.xcodeproj \
            -target AevisCallProbe \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            AEVIS_COMMIT="$AEVIS_COMMIT" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            > callprobe-build.log 2>&1 || { echo "===== CALLPROBE BUILD FAILED ====="; tail -n 200 callprobe-build.log; exit 1; }

          echo "===== CALLPROBE BUILD OK ====="
          tail -n 6 callprobe-build.log

          # ⭐ 权限到底有没有被编进去 —— 当场看见。
          #    编出来没有 entitlements 的话，装上去必然不通，白跑一轮。
          echo "--- 产物 ---"
          ls -la build/Release-iphoneos/ 2>/dev/null || true
          echo "--- entitlements（编出来那份）---"
          codesign -d --entitlements :- build/Release-iphoneos/AevisCallProbe.app 2>/dev/null \
            || echo "（未签名包读不到，正常 —— 以手机上重签后的为准）"

      - name: Surface errors as annotations
        if: failure()
        run: |
          grep -E "error:" callprobe-build.log 2>/dev/null | head -15 | while IFS= read -r line; do
            echo "::error::$line"
          done

      # ——— 打包（只在被要求时）———
      #
      # ⚠️ 注意这个探针**没有嵌套扩展**，所以打包比 VPN 探针简单：
      #    只清外层签名痕迹。（VPN 探针那边要连 PlugIns 里的 appex 一起清。）
      - name: Package IPA
        if: steps.gate.outputs.go == 'yes' && steps.decide.outputs.should == 'yes'
        run: |
          set -e
          APP="build/Release-iphoneos/AevisCallProbe.app"
          test -d "$APP" || { echo "找不到 AevisCallProbe.app"; exit 1; }

          rm -rf Payload AevisCallProbe-unsigned.ipa AevisCallProbe-adhoc.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/AevisCallProbe.app

          # 清掉签名痕迹 —— 手机上「全能签」会重新签它。
          rm -rf Payload/AevisCallProbe.app/_CodeSignature
          rm -f Payload/AevisCallProbe.app/embedded.mobileprovision

          /usr/bin/zip -qry -X AevisCallProbe-unsigned.ipa Payload

          codesign -f -s - --deep Payload/AevisCallProbe.app || true
          /usr/bin/zip -qry -X AevisCallProbe-adhoc.ipa Payload

          echo "包里的版本："
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" \
            Payload/AevisCallProbe.app/Info.plist || true
          echo "包里的 bundle id："
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" \
            Payload/AevisCallProbe.app/Info.plist || true
          echo "包里的后台模式："
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" \
            Payload/AevisCallProbe.app/Info.plist || true
          ls -lh AevisCallProbe-unsigned.ipa AevisCallProbe-adhoc.ipa

      - name: Publish release
        if: steps.gate.outputs.go == 'yes' && steps.decide.outputs.should == 'yes'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: callprobe-${{ github.run_number }}
          name: Aevis 通话探针 ${{ github.run_number }}
          prerelease: true
          body: |
            **通话探针** —— 一次性体检包，不是给买家用的。

            它只回答一个问题：**这套签名能不能弹系统级通话界面？**

            怎么用：
            1. 下载 `AevisCallProbe-unsigned.ipa`，用「全能签」签名后安装
            2. 打开 App，它一进去就会打出一份体检报告
            3. 点「拨一通试试」，留意**屏幕上有没有弹出系统通话界面**
            4. 点「复制全部」，把整份日志发回来

            ⚠️ 这一通电话是**假的**（3 秒自动挂断，不接真实声音），
               只看系统界面弹不弹 —— 所以不会吵到谁，也不用怕。

            ⚠️ 它会问你要**麦克风权限**，**要给它** ——
               不给的话系统会在起会话那一步直接拒，而报错长得跟
               "CallKit 走不通"一模一样，会把结论带偏。

            - 提交：`${{ github.sha }}`
          files: |
            AevisCallProbe-unsigned.ipa
            AevisCallProbe-adhoc.ipa
            callprobe-build.log

      - name: Publish failure log
        if: failure() && hashFiles('callprobe-build.log') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: callprobe-log-${{ github.run_number }}
          name: 通话探针失败日志 ${{ github.run_number }}
          prerelease: true
          body: |
            探针编译失败 —— 错误见 `callprobe-build.log`。

            - 提交：`${{ github.sha }}`
          files: |
            callprobe-build.log

      # ⚠️ 这一步**故意不 push**（原因见 admin.yml 里那段血泪）。
      - name: Remind to reset the flag
        if: steps.gate.outputs.go == 'yes' && steps.decide.outputs.should == 'yes'
        run: |
          echo "::warning::通话探针包已出。把 .release/callprobe 改回 0 再推一次，否则下次还会出包。"
