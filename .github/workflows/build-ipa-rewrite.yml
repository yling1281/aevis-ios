name: iOS rewrite (unsigned ipa)

# 2026-11-17（138）：新 iOS 工程（SwiftUI，`ios-rewrite/`）的独立出包流水线。
#
# 为什么不复用 `build-ipa.yml`：那是旧工程（`Aevis/`，UIKit + 多个 appex）的链路，
# 两边编译产物名、target 名都不一样，混在一起早晚互相踩。这里只做新工程，互不影响。
#
# 触发：推以 `ipa-rw-` 开头的 tag，或手动 dispatch。
# 产物：未签名 ipa（`Aevis-rewrite-unsigned.ipa`），配合「全能签」自签名安装。

on:
  push:
    tags: [ 'ipa-rw-*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build rewrite ipa
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ios-rewrite

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: API smoke（只读三接口）
        run: |
          set -o pipefail
          swift Tests/ApiSmoke.swift https://q7m3ax.lingyan.cyou 2>&1 | tee api-smoke.log

      - name: Generate app icons (sips, 不依赖 actool)
        run: |
          set -eux
          SRC=AevisApp/Resources/icon-source.png
          test -f "$SRC" || { echo "::error::缺 icon-source.png"; exit 1; }
          sips -z 120 120   "$SRC" --out "AevisApp/Resources/AppIcon60x60@2x.png" >/dev/null
          sips -z 180 180   "$SRC" --out "AevisApp/Resources/AppIcon60x60@3x.png" >/dev/null
          sips -z 1024 1024 "$SRC" --out "AevisApp/Resources/AppIcon1024.png"    >/dev/null
          ls -l AevisApp/Resources/
          # 192→1024 是放大，会糊；等有 1024 原图替换 icon-source.png 即可，代码不用改

      - name: Build (Release, no signing)
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild \
            -project AevisApp.xcodeproj \
            -target AevisApp \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            SYMROOT=build \
            build 2>&1 | tee build.log
          echo "--- 汇总 ---"
          grep -c "error:" build.log || true
          grep -m 5 "BUILD SUCCEEDED" build.log || true

      - name: Collect errors
        if: always()
        run: |
          { echo "run: ${{ github.run_number }}"; echo "sha: ${{ github.sha }}"; echo; } > errors.txt
          grep -iE "error:|failed|cannot|not found|undefined symbol|No such file" build.log | head -60 >> errors.txt || true
          echo "错误行数：$(wc -l < errors.txt)"
          echo "===== build.log 末尾 120 行 =====" >> errors.txt
          tail -120 build.log >> errors.txt 2>/dev/null || true
          echo "===== 诊断 =====" >> errors.txt
          echo "pwd=$(pwd)" >> errors.txt
          ls -l AevisApp/Resources/ >> errors.txt 2>&1 || true
          echo "-- build/Release-iphoneos --" >> errors.txt
          ls -l build/Release-iphoneos/ >> errors.txt 2>&1 || true
          echo "-- 产物 app 内 --" >> errors.txt
          ls -l build/Release-iphoneos/*.app 2>/dev/null >> errors.txt || true
          head -60 errors.txt

      - name: Package unsigned ipa
        if: always() && steps.build.outcome == 'success'
        run: |
          set -e
          APP="build/Release-iphoneos/AevisApp.app"
          test -d "$APP" || { echo "::error::找不到 $APP"; ls -R build | head -40; exit 1; }

          rm -rf Payload Aevis-rewrite-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/AevisApp.app
          rm -rf Payload/AevisApp.app/_CodeSignature
          rm -f Payload/AevisApp.app/embedded.mobileprovision

          /usr/bin/zip -qry -X Aevis-rewrite-unsigned.ipa Payload
          # 打包后把图标注入 zip（绕开 Xcode 资源阶段，最稳）
          rm -rf /tmp/inj && mkdir -p /tmp/inj && cd /tmp/inj
          unzip -q "$OLDPWD/Aevis-rewrite-unsigned.ipa" -d .
          SRC="$OLDPWD/AevisApp/Resources/icon-source.png"
          sips -z 120 120 "$SRC" --out Payload/AevisApp.app/AppIcon60x60@2x.png >/dev/null
          sips -z 180 180 "$SRC" --out Payload/AevisApp.app/AppIcon60x60@3x.png >/dev/null
          sips -z 1024 1024 "$SRC" --out Payload/AevisApp.app/AppIcon1024.png >/dev/null
          rm -f "$OLDPWD/Aevis-rewrite-unsigned.ipa"
          zip -qry -X "$OLDPWD/Aevis-rewrite-unsigned.ipa" Payload
          echo "--- 注入后 zip 内 AppIcon ---"; unzip -l "$OLDPWD/Aevis-rewrite-unsigned.ipa" | grep -i appicon || echo NO_ICON
          cd "$OLDPWD"
          ls -lh Aevis-rewrite-unsigned.ipa

          # 0 字节资产会让整批 Release 发布失败（旧流水线踩过），这里先拦一手
          SIZE=$(wc -c < Aevis-rewrite-unsigned.ipa | tr -d ' ')
          echo "ipa 字节数：$SIZE"
          test "$SIZE" -gt 100000 || { echo "::error::ipa 只有 $SIZE 字节，不发布"; exit 1; }

      - name: Verify icon in ipa（证据）
        if: steps.build.outcome == 'success'
        run: |
          set -eux
          unzip -l Aevis-rewrite-unsigned.ipa
          rm -rf /tmp/chk && mkdir -p /tmp/chk
          unzip -q -o Aevis-rewrite-unsigned.ipa -d /tmp/chk
          plutil -p /tmp/chk/Payload/AevisApp.app/Info.plist | grep -A8 CFBundleIcons || true
          N=$(unzip -l Aevis-rewrite-unsigned.ipa | grep -c "AppIcon" || true)
          echo "AppIcon 条目数：$N"
          unzip -l Aevis-rewrite-unsigned.ipa | grep "AppIcon" || true
          if [ "$N" -lt 3 ]; then echo "::warning::ipa 里只有 $N 个 AppIcon（先不阻断，人工核验）"; fi

      - name: Read marketing version
        id: ver
        if: always()
        run: |
          V=$(grep -m1 "MARKETING_VERSION" AevisApp.xcodeproj/project.pbxproj \
                | sed -E 's/.*MARKETING_VERSION = ([^;]+);.*/\1/' || true)
          echo "version=${V:-unknown}" >> "$GITHUB_OUTPUT"
          echo "版本：${V:-unknown}"

      - name: Publish rewrite ipa
        if: always() && steps.build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ipa-rw-${{ github.run_number }}
          name: Aevis rewrite ${{ github.run_number }}
          prerelease: true
          body: |
            新 iOS 工程（`ios-rewrite/`）未签名安装包。

            - run: `${{ github.run_number }}`
            - 版本: `${{ steps.ver.outputs.version }}`
            - 提交: `${{ github.sha }}`
            - 安装: 下载 `Aevis-rewrite-unsigned.ipa`，用「全能签」签名后安装
          files: |
            ios-rewrite/Aevis-rewrite-unsigned.ipa
            ios-rewrite/build.log
            ios-rewrite/api-smoke.log

      - name: Publish failure report
        if: failure() || steps.build.outcome != 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ipa-rw-fail-${{ github.run_number }}
          name: Aevis rewrite 失败 ${{ github.run_number }}
          prerelease: true
          body_path: ios-rewrite/errors.txt
          files: |
            ios-rewrite/errors.txt
            ios-rewrite/build.log
            ios-rewrite/api-smoke.log

      # 打包产物发布到 GitHub Release（见上一步 Publish rewrite ipa）。
      # 服务器推送 + 更新提醒由本地一键脚本 build_user/publish_rewrite_ipa.py 完成：
      # 它会从 Release 下载最新 IPA，走 paramiko 上传到 4-4 并更新 aevis_app_release 表。
      # 不放进 CI 的原因：4-4 只接受密码登录，且经香港跳板，凭据不能明文进 workflow。

      - name: Push logs to ci-log branch
        if: always()
        run: |
          set -x
          mkdir -p ci-logs || true
          cp errors.txt ci-logs/errors.txt 2>/dev/null || true
          cp build.log ci-logs/build.log 2>/dev/null || true
          cp api-smoke.log ci-logs/api-smoke.log 2>/dev/null || true
          ls -l ci-logs || true
          git config user.email "ci@aevis.cn"
          git config user.name "aevis-ci"
          git checkout -B ci-log
          git add -f ci-logs || true
          git commit -m "ci: run ${{ github.run_number }} logs" || true
          git push -f origin ci-log || true
  screenshots:
    name: Screenshots (simulator, -demo)
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ios-rewrite

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild             -project AevisApp.xcodeproj             -scheme AevisApp             -sdk iphonesimulator             -configuration Debug             -derivedDataPath build             CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""             build 2>&1 | tee sim-build.log

      - name: Boot simulator & install
        run: |
          set -eux
          DEV=$(xcrun simctl list devices available | grep -m1 -E "iPhone (15|16|17) \(" | sed -E "s/.*\(([0-9A-F-]{36})\).*/\1/")
          test -n "$DEV" || { echo "::error::没有可用的 iPhone 模拟器"; exit 1; }
          xcrun simctl boot "$DEV" || true
          xcrun simctl bootstatus "$DEV" -b
          APP=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          test -n "$APP" || { echo "::error::没找到 .app"; find build -name "*.app" | head; exit 1; }
          xcrun simctl install "$DEV" "$APP"
          echo "DEV=$DEV" >> "$GITHUB_ENV"

      - name: Shoot 3 screens (chat / list / login)
        run: |
          set -eux
          mkdir -p shots
          for MODE in chat list login; do
            xcrun simctl terminate "$DEV" com.aevis.app 2>/dev/null || true
            xcrun simctl launch "$DEV" com.aevis.app -demo "$MODE"
            sleep 7
            xcrun simctl io "$DEV" screenshot "shots/ios-$MODE.png"
          done
          ls -l shots

      - name: Assert demo marker
        run: |
          set -eux
          LOG=$(xcrun simctl spawn "$DEV" log show --last 5m --style compact                   --predicate 'eventMessage CONTAINS "AEVIS_DEMO_ON"' 2>/dev/null || true)
          echo "$LOG" | tail -20
          echo "$LOG" | grep -q AEVIS_DEMO_ON || { echo "::error::-demo 没生效，截图可能是登录页"; exit 1; }

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: ios-rewrite/shots
          if-no-files-found: warn

      - name: Upload sim build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-sim-logs
          path: ios-rewrite/sim-build.log
          if-no-files-found: ignore
