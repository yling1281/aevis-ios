name: CallProbe2

# 通话探针 2 号 —— **一次性工具**，跟买家那个包、跟管理端、跟 VPN 探针都无关。
#
# 它在第 1 号探针的基础上补一个关键变量：
#   **把「内嵌扩展」这一条单独摘出来验。**
#
# 起因：1 号探针在真机上**灵动岛确实弹了**（老板 2026-10-01 实测口述），
#   而主 App 弹不出来。于是把主 App 和 1 号探针逐条对了一遍，
#   通话相关的 12 项**全部一模一样**，只剩 3 处差别：
#     ① 主 App 嵌了 `AevisBroadcast.appex`，1 号探针是单可执行文件
#     ② 主 App deploymentTarget 17.0，1 号探针 17.4
#     ③ 主 App 启动时音频会话已被 QQ 保活占用（.playback），1 号探针是干净的
#
#   这个探针把 ① 和 ③ 一起复刻（② 跟着提 17.4），并且留一个开关：
#     - 界面上「拨号前先占住音频会话」这个开关 = 验 ③
#     - 包里嵌了一个**空壳 appex**（签名故意留空） = 验 ①（这是最可疑的一条）
#
#   结论怎么读：
#     弹出 = 元凶是这 3 条之一（再对照开关状态就能定位到具体哪条）
#     还是不弹 = 确认是**描述文件本身没通话资格**，跟这几条都无关
#   无论哪个结果都是可执行的答案，不用再猜。
#
# 为什么单开一条：探针编不过绝不能拖累买家的包。
#
# ⚠️ 它**自己做 bootstrap（源码引导）**，理由跟 1 号探针、VPN 探针一模一样 ——
#    是个**竞态**（两条流水线同时被同一次 push 触发，谁先谁后没保证）。
#    门禁**三样都查**（两个源文件 + project.yml 里有没有这个 target），
#    缺任何一样就整轮跳过 —— 而不是编到一半报"找不到 target"。
#
# ⚠️ 它**不 push 仓库**（跟 admin.yml 一个教训：两条流水线都写仓库必然撞车）。
#
# 要出探针 IPA：把 `.release/callprobe2` 改成 1 再推。出完**人工**改回 0。

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  callprobe2:
    name: Build call probe 2
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap source (temporary)
        if: hashFiles('.bootstrap-url') != ''
        run: |
          set -e
          SRC_URL=$(tr -d ' \n\r' < .bootstrap-url)
          echo "从 $SRC_URL 取源码"
          curl -fsSL --retry 4 --retry-all-errors --retry-delay 3 \
            --max-time 300 -o "$RUNNER_TEMP/src.zip" "$SRC_URL"
          SIZE=$(wc -c < "$RUNNER_TEMP/src.zip")
          echo "拿到 $SIZE 字节"
          test "$SIZE" -gt 200000 || { echo "源码包不完整"; exit 1; }
          rm -rf "$RUNNER_TEMP/src"
          mkdir -p "$RUNNER_TEMP/src"
          unzip -q "$RUNNER_TEMP/src.zip" -d "$RUNNER_TEMP/src"
          rsync -a "$RUNNER_TEMP/src/aevis-ios/" ./
          echo "探针 Swift 文件: $(find AevisCallProbe2 -name '*.swift' 2>/dev/null | wc -l)"

      # ⚠️ 门禁要**三样都查**，缺一不可：
      #    两个源文件 + **project.yml 里那个 target**。
      #    实测过的坑：`.bootstrap-url` 指向的包里要是没有探针，
      #    rsync 会把 project.yml **盖回旧版**，target 就没了。
      #    那种情况要**整轮跳过**，而不是编到一半报"找不到 target"。
      - name: Check whether the probe sources are here
        id: gate
        run: |
          if [ -f AevisCallProbe2/App/CallProbe2App.swift ] \
             && [ -f AevisCallProbe2/App/CallProbe2Model.swift ] \
             && grep -q '^  AevisCallProbe2:' project.yml; then
            echo "go=yes" >> "$GITHUB_OUTPUT"
            echo "探针源码和 target 都在，继续。"
          else
            echo "go=no" >> "$GITHUB_OUTPUT"
            echo "缺少探针源码或 project.yml 里没有这个 target，这一轮跳过。"
          fi

      - name: Decide whether to package an IPA
        id: decide
        if: steps.gate.outputs.go == 'yes'
        run: |
          REQ=$(tr -d ' \n\r' < .release/callprobe2 2>/dev/null || echo "0")
          if [ "$REQ" = "1" ]; then
            echo "should=yes" >> "$GITHUB_OUTPUT"
            echo "本次会出探针 IPA"
          else
            echo "should=no" >> "$GITHUB_OUTPUT"
            echo "本次只验证能编过，不出 IPA"
          fi

      - name: Show toolchain
        if: steps.gate.outputs.go == 'yes'
        run: |
          xcodebuild -version
          echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Install XcodeGen
        if: steps.gate.outputs.go == 'yes'
        run: brew install xcodegen

      - name: Generate Xcode project
        if: steps.gate.outputs.go == 'yes'
        run: xcodegen generate

      # ——— 真机编译 ———
      #
      # ⚠️ 目标是 **AevisCallProbe2**（17.4）。它带一个内嵌扩展 target，
      #    xcodegen 会按 `dependencies: embed: true` 把它嵌进去。
      #    编不过就是"这条路要抬 deploymentTarget / 嵌扩展有代价"的证据。
      - name: Compile (device, unsigned)
        if: steps.gate.outputs.go == 'yes'
        env:
          AEVIS_COMMIT: ${{ github.sha }}
        run: |
          set -o pipefail
          xcodebuild \
            -project Aevis.xcodeproj \
            -target AevisCallProbe2 \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            AEVIS_COMMIT="$AEVIS_COMMIT" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            > callprobe2-build.log 2>&1 || { echo "===== CALLPROBE2 BUILD FAILED ====="; tail -n 200 callprobe2-build.log; exit 1; }

          echo "===== CALLPROBE2 BUILD OK ====="
          tail -n 6 callprobe2-build.log

          # ⭐ 两件事当场看见：
          #    1. 权限有没有被编进去（没有的话装上去必然不通）
          #    2. **扩展到底嵌没嵌进去** —— 这是这个探针唯一要验的变量，
          #       没嵌进去等于白跑一轮。
          echo "--- 产物 ---"
          ls -la build/Release-iphoneos/ 2>/dev/null || true
          echo "--- 内嵌扩展（这是本探针的关键变量）---"
          ls -la build/Release-iphoneos/AevisCallProbe2.app/PlugIns/ 2>/dev/null \
            || echo "❗️ PlugIns 是空的 —— 扩展没嵌进去，这一轮结论无效"
          echo "--- entitlements（编出来那份）---"
          codesign -d --entitlements :- build/Release-iphoneos/AevisCallProbe2.app 2>/dev/null \
            || echo "（未签名包读不到，正常 —— 以手机上重签后的为准）"

      - name: Surface errors as annotations
        if: failure()
        run: |
          grep -E "error:" callprobe2-build.log 2>/dev/null | head -15 | while IFS= read -r line; do
            echo "::error::$line"
          done

      # ——— 打包（只在被要求时）———
      #
      # ⚠️ 跟 1 号探针**不一样**：这个探针**嵌了扩展**（就是它要验的东西），
      #    所以签名痕迹要**连 PlugIns 里的 appex 一起清**。
      #    只清外层的话，全能签重签时会拿被污染的 appex 去签，
      #    表现就是"装不上"或"装了但扩展被剥掉" —— 两个都会把结论带偏。
      #    外层和 appex 的 `_CodeSignature` / `embedded.mobileprovision` 都必须清。
      - name: Package IPA
        if: steps.gate.outputs.go == 'yes' && steps.decide.outputs.should == 'yes'
        run: |
          set -e
          APP="build/Release-iphoneos/AevisCallProbe2.app"
          test -d "$APP" || { echo "找不到 AevisCallProbe2.app"; exit 1; }

          rm -rf Payload AevisCallProbe2-unsigned.ipa AevisCallProbe2-adhoc.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/AevisCallProbe2.app

          # 清掉外层签名痕迹 —— 手机上「全能签」会重新签它。
          rm -rf Payload/AevisCallProbe2.app/_CodeSignature
          rm -f Payload/AevisCallProbe2.app/embedded.mobileprovision

          # ⚠️ 再清**每一个内嵌 appex** 的签名痕迹（本探针和 1 号探针的分水岭）。
          if [ -d Payload/AevisCallProbe2.app/PlugIns ]; then
            echo "--- 清理内嵌扩展的签名痕迹 ---"
            find Payload/AevisCallProbe2.app/PlugIns -maxdepth 2 -name '_CodeSignature' \
              -type d -print -exec rm -rf {} + 2>/dev/null || true
            find Payload/AevisCallProbe2.app/PlugIns -maxdepth 2 -name 'embedded.mobileprovision' \
              -type f -print -delete 2>/dev/null || true
          else
            echo "❗️ 打包时 PlugIns 目录不存在 —— 扩展没嵌进去，这一轮结论无效"
          fi

          /usr/bin/zip -qry -X AevisCallProbe2-unsigned.ipa Payload

          # adhoc 那份也照样先清一遍（`--deep` 会重签整棵子树，但痕迹得先清干净）。
          codesign -f -s - --deep Payload/AevisCallProbe2.app || true
          /usr/bin/zip -qry -X AevisCallProbe2-adhoc.ipa Payload

          echo "包里的版本："
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" \
            Payload/AevisCallProbe2.app/Info.plist || true
          echo "包里的 bundle id："
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" \
            Payload/AevisCallProbe2.app/Info.plist || true
          echo "包里的后台模式："
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" \
            Payload/AevisCallProbe2.app/Info.plist || true
          echo "包里的内嵌扩展（关键）："
          ls -1 Payload/AevisCallProbe2.app/PlugIns/ 2>/dev/null || echo "（没有）"
          ls -lh AevisCallProbe2-unsigned.ipa AevisCallProbe2-adhoc.ipa

      - name: Publish release
        if: steps.gate.outputs.go == 'yes' && steps.decide.outputs.should == 'yes'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: callprobe2-${{ github.run_number }}
          name: Aevis 通话探针 2 号 ${{ github.run_number }}
          prerelease: true
          body: |
            **通话探针 2 号** —— 一次性体检包，不是给买家用的。

            1 号探针在真机上**灵动岛弹出来了**，可主 App 弹不出来。
            把两边逐条对比后只剩 3 处差别，这个包就是来分辨它们的：

            | # | 主 App | 1 号探针 | 本包 |
            |---|---|---|---|
            | ① 内嵌扩展 | 有 `AevisBroadcast.appex` | 没有 | **有**（空壳） |
            | ② deploymentTarget | 17.0 | 17.4 | 17.4 |
            | ③ 启动时音频会话 | 已被占用 | 干净 | **有开关**，能自己切 |

            怎么用：
            1. 下载 `AevisCallProbe2-unsigned.ipa`，用「全能签」签名后安装
            2. 打开 App，它一进去就打出一份体检报告（会告诉你**扩展有没有嵌进来**）
            3. **先按默认设置**（开关是「开」= 先占音频）点「拨一通试试」，
               留意屏幕上有没有弹出**系统通话界面 / 灵动岛**
            4. 把开关**关掉**再拨一次（= 回到 1 号探针的状态）
            5. 点「复制全部」，把整份日志发回来

            ⚠️ 这一通电话是**假的**（3 秒自动挂断，不接真实声音），
               只看系统界面弹不弹 —— 所以不会吵到谁，也不用怕。

            ⚠️ 它会问你要**麦克风权限**，**要给它** ——
               不给的话系统会在起会话那一步直接拒，而报错长得跟
               "CallKit 走不通"一模一样，会把结论带偏。

            - 提交：`${{ github.sha }}`
          files: |
            AevisCallProbe2-unsigned.ipa
            AevisCallProbe2-adhoc.ipa
            callprobe2-build.log

      - name: Publish failure log
        if: failure() && hashFiles('callprobe2-build.log') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: callprobe2-log-${{ github.run_number }}
          name: 通话探针 2 号失败日志 ${{ github.run_number }}
          prerelease: true
          body: |
            探针 2 号编译失败 —— 错误见 `callprobe2-build.log`。

            - 提交：`${{ github.sha }}`
          files: |
            callprobe2-build.log

      # ⚠️ 这一步**故意不 push**（原因见 admin.yml 里那段血泪）。
      - name: Remind to reset the flag
        if: steps.gate.outputs.go == 'yes' && steps.decide.outputs.should == 'yes'
        run: |
          echo "::warning::探针 2 号包已出。把 .release/callprobe2 改回 0 再推一次，否则下次还会出包。"
