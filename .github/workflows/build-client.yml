name: build-client

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version

      - name: Fetch client sources
        run: |
          rm -rf ios_client
          curl -fsSL https://aevis.cn/dl/ios_client-src.zip -o /tmp/src.zip
          unzip -q /tmp/src.zip -d .
          ls -la ios_client
          ls -la ios_client/Sources

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: |
          cd ios_client
          xcodegen generate
          ls -la
          xcodebuild -list -project AevisClient.xcodeproj

      - name: Build (unsigned)
        run: |
          set -o pipefail
          cd ios_client
          mkdir -p build
          xcodebuild build \
            -project AevisClient.xcodeproj \
            -scheme AevisClient \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CONFIGURATION_BUILD_DIR="$PWD/build/Release-iphoneos" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee "$GITHUB_WORKSPACE/xcodebuild.log"

      - name: Package IPA
        run: |
          cd ios_client
          ls -la build/Release-iphoneos || true
          APP=$(find build/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "app=$APP"
          test -n "$APP"
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build
          zip -qry Aevis-unsigned.ipa Payload
          ls -lh Aevis-unsigned.ipa
          shasum -a 256 Aevis-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aevis-unsigned-ipa
          path: ios_client/build/Aevis-unsigned.ipa

      - name: Publish IPA release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="client-${{ github.run_number }}"
          gh release create "$TAG" ios_client/build/Aevis-unsigned.ipa --title "Aevis iOS 客户端 ${{ github.run_number }}" --notes "未签名 IPA（unsigned），自签后安装"

      - name: Publish build log
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ios_client
          find build -name '*.app' -maxdepth 3 2>/dev/null | head -5 > app-list.txt || true
          { echo "workflow=build-client run=${{ github.run_number }} sha=${{ github.sha }}"; \
            echo "--- app list ---"; cat app-list.txt 2>/dev/null; \
            echo "--- xcodebuild tail ---"; tail -n 400 "$GITHUB_WORKSPACE/xcodebuild.log" 2>/dev/null; } > "$GITHUB_WORKSPACE/client-build.log"
          TAG="log-client-${{ github.run_number }}"
          gh release create "$TAG" "$GITHUB_WORKSPACE/client-build.log" --title "客户端构建日志 ${{ github.run_number }}" --notes "xcodebuild 输出尾部 400 行" || \
          gh release upload "$TAG" "$GITHUB_WORKSPACE/client-build.log" --clobber
