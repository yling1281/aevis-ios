name: build-client

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version

      - name: Fetch client sources
        run: |
          if [ ! -d ios_client/Sources ]; then
            curl -fsSL https://aevis.cn/dl/ios_client-src.zip -o /tmp/src.zip
            unzip -q /tmp/src.zip -d .
          fi
          ls -la ios_client
          ls -la ios_client/Sources

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: |
          cd ios_client
          xcodegen generate
          ls -la
          xcodebuild -list -project AevisClient.xcodeproj

      - name: Build (unsigned)
        run: |
          set -o pipefail
          cd ios_client
          mkdir -p build
          xcodebuild build \
            -project AevisClient.xcodeproj \
            -scheme AevisClient \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CONFIGURATION_BUILD_DIR="$PWD/build/Release-iphoneos" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            2>&1 | tee "$GITHUB_WORKSPACE/xcodebuild.log"

      - name: Package IPA
        run: |
          cd ios_client
          ls -la build/Release-iphoneos || true
          APP=$(find build/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "app=$APP"
          test -n "$APP"
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build
          zip -qry Aevis-unsigned.ipa Payload
          ls -lh Aevis-unsigned.ipa
          shasum -a 256 Aevis-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aevis-unsigned-ipa
          path: ios_client/build/Aevis-unsigned.ipa

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="client-${{ github.run_number }}"
          gh release create "$TAG" ios_client/build/Aevis-unsigned.ipa --title "$TAG" --notes "Aevis iOS client unsigned IPA"

      - name: Publish build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="log-client-${{ github.run_number }}"
          printf '%s\n' "workflow=build-client run=${{ github.run_number }} sha=${{ github.sha }}" > "$GITHUB_WORKSPACE/header.txt"
          cat "$GITHUB_WORKSPACE/header.txt" "$GITHUB_WORKSPACE/xcodebuild.log" > "$GITHUB_WORKSPACE/full.log" 2>/dev/null || cp "$GITHUB_WORKSPACE/header.txt" "$GITHUB_WORKSPACE/full.log"
          tail -n 300 "$GITHUB_WORKSPACE/full.log" > "$GITHUB_WORKSPACE/log-tail.txt"
          gh release create "$TAG" "$GITHUB_WORKSPACE/log-tail.txt" --title "$TAG" --notes "xcodebuild 失败日志（尾部 300 行）" || true
