name: Android

# 安卓版：和 iOS 同一套后端、同一套 UI（用户 2026-11-13：「照搬 iOS 版，
# 完全模拟 iOS 的 UI，动效我不管」）。
#
# 这个 workflow 只做一件事：把 android/ 编成**可侧载安装的 debug APK**，
# 发到 Release（public 仓库的 Release 资源不用登录就能下）。
on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
    tags: [ 'apk-*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 第一次跑要下 AGP / Compose 那一堆依赖，慢是正常的
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          set -e
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          echo "产物：$APK"
          test -s "$APK" || { echo "没有 APK"; exit 1; }
          cp "$APK" Aevis-android-debug.apk
          ls -lh Aevis-android-debug.apk

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Aevis Android ${{ github.run_number }}
          prerelease: true
          body: |
            安卓版安装包（debug 签名，直接侧载安装）。

            - 提交：`${{ github.sha }}`
            - 安装：手机允许「安装未知来源应用」后点开 apk
          files: android/Aevis-android-debug.apk
