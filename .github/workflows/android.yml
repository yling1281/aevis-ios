name: Android

# 安卓版：和 iOS 同一套后端、同一套 UI（用户 2026-11-13：「照搬 iOS 版，
# 完全模拟 iOS 的 UI，动效我不管」）。
#
# 这个 workflow 只做一件事：把 android/ 编成**可侧载安装的 debug APK**，
# 发到 Release（public 仓库的 Release 资源不用登录就能下）。
on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
    tags: [ 'apk-*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ⚠️ 2026-11-13：`android-actions/setup-android@v3` 在 ubuntu-latest 上
      #    直接失败（SDK 目录/许可那一步），所以改成自己下 cmdline-tools。
      - name: Set up Android SDK
        run: |
          set -e
          SDK="${ANDROID_HOME:-$HOME/android-sdk}"
          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$SDK/cmdline-tools"
            curl -sSLo /tmp/cmdline.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline.zip -d "$SDK/cmdline-tools"
            rm -rf "$SDK/cmdline-tools/latest"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          fi
          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0" \
            "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 第一次跑要下 AGP / Compose 那一堆依赖，慢是正常的
      - name: Build release APK
        run: |
          set -o pipefail
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      # 失败时把日志发到 Release，否则 Actions 日志要登录才看得到
      - name: Upload build log on failure
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: log-android-${{ github.run_number }}
          name: Android build log ${{ github.run_number }}
          prerelease: true
          body: "构建失败，日志见附件"
          files: android/build.log

      - name: Collect APK
        run: |
          set -e
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "产物：$APK"
          test -s "$APK" || { echo "没有 APK"; exit 1; }
          cp "$APK" Aevis-android-debug.apk
          ls -lh Aevis-android-debug.apk

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Aevis Android ${{ github.run_number }}
          prerelease: true
          body: |
            安卓版安装包（debug 签名，直接侧载安装）。

            - 提交：`${{ github.sha }}`
            - 安装：手机允许「安装未知来源应用」后点开 apk
          files: android/Aevis-android-debug.apk
