# 零砚后台（iOS）—— 单独一条流水线，单独的工程、单独的目录，**不碰 Aevis 那几条**。
#
# 出什么：
#   LingyanAdmin-unsigned.ipa   ← 手机上用「全能签」之类再签一次就能装
#   LingyanAdmin-adhoc.ipa      ← 备用（adhoc 签）
#   shots.zip                   ← 模拟器截图自检（每页一张）
#
# 为什么用 paths 过滤：这个仓库里 Aevis 那几条流水线都没有过滤，
# 推任何东西都会一起跑。加上过滤之后，只有动到 LingyanAdmin 的东西才跑这一条。
#
# ⚠️ 本流水线**不 push 仓库**。仓库里负责"把源码落回"的是 Aevis 主流水线那一条，
#    两条都推必然撞车（见 admin.yml 里的血泪注释）。这里只读、只构建、只发 Release。

name: LingyanAdmin

on:
  push:
    branches: [ main ]
    paths:
      - 'LingyanAdmin/**'
      - '.github/workflows/lingyan-admin.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  app:
    name: Build 零砚后台
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Install XcodeGen
        run: brew install xcodegen

      # 图标 PNG 不进仓库（二进制），每次在 CI 现生成
      - name: Generate app icon
        run: python3 LingyanAdmin/scripts/make_icon.py LingyanAdmin/Resources

      - name: Generate Xcode project
        run: cd LingyanAdmin && xcodegen generate

      # ---------- 真机编译（未签名） ----------
      - name: Compile (device, unsigned)
        env:
          LY_COMMIT: ${{ github.sha }}
        run: |
          set -o pipefail
          LOG="$GITHUB_WORKSPACE/lingyan-build.log"
          cd LingyanAdmin
          xcodebuild \
            -project LingyanAdmin.xcodeproj \
            -target LingyanAdmin \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            LY_COMMIT="$LY_COMMIT" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            > "$LOG" 2>&1 || { echo "===== BUILD FAILED ====="; tail -n 200 "$LOG"; exit 1; }
          echo "===== BUILD OK ====="
          tail -n 6 "$LOG"

      # 编译错误同时以 workflow 命令发到 Annotations 区（那块免鉴权可读）
      - name: Surface errors as annotations
        if: failure()
        run: |
          grep -E "error:" "$GITHUB_WORKSPACE/lingyan-build.log" 2>/dev/null | head -15 | while IFS= read -r line; do
            echo "::error::$line"
          done

      # ---------- 打包 IPA ----------
      #
      # ⚠️ 给这个步骤一个 id：后面「发 Release」只认它，不认"整轮是不是全绿"。
      #    教训（2026-10-08 run #1）：编译和打包都成功了，挂在最后面的收尾步骤上
      #    （截图一张没截到 → zip 空目录报错），结果 `if: success()` 的发布步骤
      #    被跳过 —— **IPA 明明打好了却没上传**，看着就像"编译失败"。
      #    出包的优先级最高，任何非编译类的小毛病都不许把包吞掉。
      - name: Package IPA
        id: pkg
        run: |
          set -e
          APP="LingyanAdmin/build/Release-iphoneos/LingyanAdmin.app"
          test -d "$APP" || { echo "找不到 LingyanAdmin.app"; ls -la LingyanAdmin/build/Release-iphoneos || true; exit 1; }

          rm -rf Payload LingyanAdmin-unsigned.ipa LingyanAdmin-adhoc.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/LingyanAdmin.app
          rm -rf Payload/LingyanAdmin.app/_CodeSignature
          rm -f  Payload/LingyanAdmin.app/embedded.mobileprovision

          /usr/bin/zip -qry -X LingyanAdmin-unsigned.ipa Payload

          codesign -f -s - --deep Payload/LingyanAdmin.app || true
          /usr/bin/zip -qry -X LingyanAdmin-adhoc.ipa Payload

          echo "包里信息："
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" Payload/LingyanAdmin.app/Info.plist || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Payload/LingyanAdmin.app/Info.plist || true
          /usr/libexec/PlistBuddy -c "Print :LingyanCommit" Payload/LingyanAdmin.app/Info.plist || true
          ls -lh LingyanAdmin-unsigned.ipa LingyanAdmin-adhoc.ipa

          echo "ok=1" >> "$GITHUB_OUTPUT"

      # ---------- 模拟器截图自检 ----------
      # 自绘/新写的界面必须靠截图验收（"编译通过" ≠ "能用"）。
      # -demo 走本地假数据：截图时不带真 Key，也就不会把 Key 泄进公开仓库。
      #
      # ⚠️ 两条铁律（都是 run #1 踩出来的）：
      #   ① `continue-on-error: true` —— **截图失败绝不能拖挂出包**；
      #   ② 不许再用 `|| echo warning` 把错误吞掉 —— 那样步骤"成功"、图却一张没有，
      #      排查时完全没有线索。现在每一句 simctl 都进 `lingyan-shot.log`，
      #      失败带上原因，日志跟包一起发出来。
      - name: Screenshots (simulator)
        id: shots
        if: steps.pkg.outputs.ok == '1'
        continue-on-error: true
        run: |
          set +e
          SHOTLOG="$GITHUB_WORKSPACE/lingyan-shot.log"
          : > "$SHOTLOG"

          say () { echo "$@" | tee -a "$SHOTLOG"; }
          # 跑一句命令：既进控制台也进日志，返回它自己的退出码
          runlog () { say "\$ $*"; "$@" 2>&1 | tee -a "$SHOTLOG"; return "${PIPESTATUS[0]}"; }

          say "===== 截图自检 $(date -u +%FT%TZ) ====="
          mkdir -p shots
          : > shots/.keep

          LOG="$GITHUB_WORKSPACE/lingyan-sim.log"
          say "--- 1) 编模拟器版 ---"
          cd LingyanAdmin
          runlog xcodebuild -project LingyanAdmin.xcodeproj -target LingyanAdmin \
            -configuration Release -sdk iphonesimulator -arch arm64 \
            SYMROOT="$PWD/simbuild" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          cd "$GITHUB_WORKSPACE"

          APP="LingyanAdmin/simbuild/Release-iphonesimulator/LingyanAdmin.app"
          if [ ! -d "$APP" ]; then
            say "!! 找不到模拟器版 App：$APP（这一步到此为止，见上面的编译输出）"
            exit 0
          fi
          say "App 就位：$APP"

          # --- 2) 找一台模拟器 ---
          # 优先自己 create 一台干净的；create 失败/返回的不是 UUID 就退回
          # 「从已有设备里挑一台 iPhone」（这条回退是 build-ipa.yml 里验证过的做法）。
          say "--- 2) 准备模拟器 ---"
          say "可用运行时："
          xcrun simctl list runtimes 2>&1 | tee -a "$SHOTLOG"

          DEVTYPE=$(xcrun simctl list devicetypes -j 2>/dev/null | python3 -c "import json,sys;d=json.load(sys.stdin)['devicetypes'];print([x['identifier'] for x in d if 'iPhone' in x['name']][-1])")
          RUNTIME=$(xcrun simctl list runtimes -j 2>/dev/null | python3 -c "import json,sys;d=json.load(sys.stdin)['runtimes'];print([x['identifier'] for x in d if x.get('isAvailable') and 'iOS' in x['name']][-1])")
          say "DEVTYPE=$DEVTYPE"
          say "RUNTIME=$RUNTIME"

          UDID=""
          if [ -n "$DEVTYPE" ] && [ -n "$RUNTIME" ]; then
            UDID=$(xcrun simctl create lyshot "$DEVTYPE" "$RUNTIME" 2>&1 | tail -1)
          fi
          case "$UDID" in
            *[!0-9A-Fa-f-]*|"") say "!! create 返回的不是 UUID（原样返回：$UDID）→ 改用已有设备"
                                UDID=$(xcrun simctl list devices available 2>/dev/null | grep -m1 "iPhone" | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/') ;;
          esac
          say "UDID=$UDID"
          if [ -z "$UDID" ]; then
            say "!! 没有任何可用模拟器，跳过截图"
            xcrun simctl list devices available 2>&1 | tee -a "$SHOTLOG"
            exit 0
          fi

          runlog xcrun simctl boot "$UDID"
          runlog xcrun simctl bootstatus "$UDID" -b
          runlog xcrun simctl install "$UDID" "$APP"
          xcrun simctl status_bar "$UDID" override --time "18:40" --batteryState charged --batteryLevel 100 >/dev/null 2>&1

          # --- 3) 逐页截图 ---
          say "--- 3) 截图 ---"
          shot () {
            name="$1"; shift
            xcrun simctl terminate "$UDID" cn.lingyan.admin >/dev/null 2>&1
            sleep 1
            # ⚠️ 别写成 `if ! cmd | tee log`：管道的状态取的是 **tee** 的，
            #    tee 永远成功 → 启动失败会被静默吞掉（run #1 就是这么瞒过去的）。
            #    先把输出和退出码接下来，再分头判断。
            say "\$ simctl launch cn.lingyan.admin $*"
            OUT=$(xcrun simctl launch "$UDID" cn.lingyan.admin "$@" 2>&1); RC=$?
            echo "$OUT" | tee -a "$SHOTLOG"
            [ "$RC" -eq 0 ] || say "!! 启动失败（rc=$RC）"
            sleep 7
            OUT=$(xcrun simctl io "$UDID" screenshot "shots/$name.png" 2>&1); RC=$?
            echo "$OUT" | tee -a "$SHOTLOG"
            if [ "$RC" -eq 0 ] && [ -s "shots/$name.png" ]; then
              say "   -> shots/$name.png $(wc -c < "shots/$name.png") 字节"
            else
              say "!! 截图失败（rc=$RC）"
              # 失败也抓一张，至少能看到当时停在哪一屏
              xcrun simctl io "$UDID" screenshot "shots/$name-FAILED.png" >/dev/null 2>&1
            fi
          }

          shot 00-设置页     -showSetup
          shot 01-概览       -demo -tab 0
          shot 02-素材       -demo -tab 1
          shot 03-设备       -demo -tab 2
          shot 04-卡密       -demo -tab 3
          shot 05-下载       -demo -tab 4

          say "--- 4) 结果 ---"
          ls -la shots/ 2>&1 | tee -a "$SHOTLOG"
          PNG=$(ls shots/*.png 2>/dev/null | wc -l | tr -d ' ')
          say "截到 $PNG 张 png"
          say "===== 截图自检结束 ====="

      # 收尾：保证每个要发布的文件都**非空**存在。
      # ⚠️ GitHub 不接受 0 字节的发布资产，files 里有一个空的，整个发布就失败。
      # ⚠️ 这一步**绝不能**把整轮判红（continue-on-error + set +e）：
      #    它只是个保洁步骤，没有任何理由让它挡住已经打好的包。
      - name: Normalize artifacts
        if: always()
        continue-on-error: true
        run: |
          set +e
          for f in lingyan-build.log lingyan-sim.log lingyan-shot.log; do
            [ -s "$f" ] || echo "（这一步没有产生内容）" > "$f"
          done
          mkdir -p shots
          if [ -z "$(ls -A shots 2>/dev/null)" ]; then
            # ⚠️ 空目录 `zip .` 会报 "Nothing to do" 并以非 0 退出 —— 必须垫一个文件
            echo "这次没有截到图，原因见 lingyan-shot.log" > shots/README.txt
          fi
          if [ ! -s shots.zip ]; then
            ( cd shots && /usr/bin/zip -qry ../shots.zip . ) || true
          fi
          [ -s shots.zip ] || echo "shots.zip 没做出来" > shots.zip
          ls -lh lingyan-build.log lingyan-sim.log lingyan-shot.log shots.zip || true
          echo "=== 产物清单 ==="
          ls -lh LingyanAdmin-unsigned.ipa LingyanAdmin-adhoc.ipa 2>/dev/null || true

      - name: Collect failure info
        if: failure()
        run: |
          {
            echo "零砚后台 iOS 构建失败。"
            echo '```'
            grep -E "error:" lingyan-build.log 2>/dev/null | head -60 || true
            echo '```'
            echo "（如果上面是空的，说明挂在编译之前的步骤 —— 去看 Run 页面的 step 列表）"
          } > errors.txt
          cat errors.txt

      # ⚠️ 发布条件看的是「IPA 有没有打出来」，不是「这一轮是不是全绿」。
      #    只要包在就发出去 —— 这样任何后续小毛病都不会把用户的包吞掉。
      - name: Publish release
        if: steps.pkg.outputs.ok == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lyadmin-${{ github.run_number }}
          name: 零砚后台 iOS ${{ github.run_number }}
          prerelease: true
          body: |
            零砚素材管理器 · **后台看板**（iOS，只读）。

            - 提交：`${{ github.sha }}`
            - 安装：下载 `LingyanAdmin-unsigned.ipa`，用「全能签 / AltStore / Sideloadly」签名后安装
            - 首次打开要填 **服务器地址**（默认 `https://lingyan.cyou:8642`）+ **API Key**
              （在电脑后台 `/admin` → 对外 API 里创建，`LYAPI-…`）
            - `shots.zip` 是模拟器截图自检（演示数据，不含任何 Key）
          files: |
            LingyanAdmin-unsigned.ipa
            LingyanAdmin-adhoc.ipa
            lingyan-build.log
            lingyan-sim.log
            lingyan-shot.log
            shots.zip

      - name: Publish failure log
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lyadmin-log-${{ github.run_number }}
          name: 零砚后台构建失败日志 ${{ github.run_number }}
          prerelease: true
          body_path: errors.txt
          files: |
            errors.txt
            lingyan-build.log
            lingyan-sim.log
            lingyan-shot.log
