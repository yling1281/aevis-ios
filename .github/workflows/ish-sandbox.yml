# ============================================================================
#  Aevis · 内置真 Linux 沙箱（iSH 系）原生构建 / 验证  —  仅手动触发
#  ---------------------------------------------------------------------------
#  这一步**不编译 App、不改任何 Swift 代码、不碰其它 workflow**。它只回答一个问题：
#  「这套东西能不能在云端 CI 上编出来、要编多久、产物多大？」
#
#  产物（上传为 artifact）：
#    - libish.a / libish_emu.a / libfakefs.a   iOS 真机 arm64 静态库
#    - vdso/arm64/libvdso.so.elf               guest aarch64 Linux ELF
#    - fakefsify / ish                         macOS host 工具（打 rootfs / 跑沙箱用）
#    - alpine-rootfs.zip                       Alpine aarch64 fakefs（data/ + meta.db）
#
#  ---------------------------------------------------------------------------
#  上游来源与许可证（合规记录）
#  ---------------------------------------------------------------------------
#  iSH 源码：https://github.com/OpenMinis/ish-arm64
#      分支  feature-arm64
#      pin   commit 54ca185b77f170e12fd353fcd7443232f6cb73fd
#      许可  GPL-3.0（仓库 LICENSE.md：iSH 采用 GPLv3，另加 LICENSE.IOS 附加条款）
#      说明  这是 ARM64 同架构 fork（asbestos 引擎，guest 为 aarch64，不依赖 JIT、
#            不需要越狱）。**不用上游 ish-app/ish**——那是 32 位 x86 的 Alpine。
#
#  Alpine minirootfs：https://dl-cdn.alpinelinux.org/alpine/v3.21/releases/aarch64/
#      版本  3.21.3，sha256 见下方 ALPINE_SHA256 常量（多镜像回退 + 强制校验）
#
#  ★ Aevis 是 **GPL-3.0 公开仓库**。任何包含上述 GPL 产物的 IPA 发布时，
#    必须能同时提供「对应源码」——即该 commit 的 iSH 源码本身（公开仓库，可直接
#    clone）＋ 可复现的构建方式（就是本文件）。GPL-3.0 与 GPL-3.0 相互兼容。
#    参考项目 Kelivo 的脚本是 AGPL-3.0，本文件**没有逐行复制**它，只参考了做法。
#
#  ---------------------------------------------------------------------------
#  构建期补丁（**必读**：这三处都是 pinned commit 自身的缺陷，上游没修；
#  我们在「取到源码之后、编译之前」用脚本改三处 —— 不 fork、不 vendor、不改上游）
#  ---------------------------------------------------------------------------
#  补丁 1  kernel/native_offload.c:714  —— **编译期**（run #3 暴露）
#          `posix_spawn_file_actions_addchdir(&actions, host_cwd)` 是 POSIX.1-2024
#          的正式名字，glibc 认；**Apple SDK 只提供 `..._addchdir_np`**
#          （见 MacOSX15.5.sdk/usr/include/spawn.h:176）
#          ⇒ macOS host 构建报 `error: call to undeclared function
#             'posix_spawn_file_actions_addchdir'`（run #3 host-ninja.log）。
#          ⚠️ 这一处**只影响 macOS host 工具**：同文件把这段代码包在
#             `#if TARGET_OS_OSX`（`#define HAS_POSIX_SPAWN 1`）里，
#             iOS 目标 TARGET_OS_OSX=0 ⇒ 整段不编 ⇒ iOS 静态库一直是绿的。
#          改法：调用点换成 `_np` 变体（语义完全一致）。
#  补丁 2  main.c:8  —— **编译期**
#          `#include <mach/mach.h>` 是**死引用** —— 整个 main.c（162 行）里除这
#          一行再没有任何 mach 符号（`grep -E 'mach_|vm_|CF[A-Z]'` 为空）。
#          改法：用 `#if defined(__APPLE__)` 包起来，Apple 上行为完全不变。
#  补丁 3  kernel/uname.c:26  —— **运行时**崩溃（run #4 才暴露）★
#          ```c
#          struct utsname real_uname;  uname(&real_uname);
#          strcpy(uts->hostname, real_uname.nodename);   // ← 就是这一行
#          ```
#          宿主 macOS 的 `struct utsname` 字段是 **256 字节**（`_SYS_NAMELEN`），
#          而 guest 侧 `struct uname` 的字段只有 **65 字节**（`UNAME_LENGTH`，
#          kernel/calls.h:256）。clang 在 `_FORTIFY_SOURCE`（macOS SDK 配 -O
#          时默认开）下能**静态判定「源对象 256 > 目标对象 65」**，于是直接插一条
#          **无条件**的 `__chk_fail_overflow()` —— 与宿主机名实际多长无关，一调必崩：
#              `HOST CRASH: signal 5` → `__chk_fail_overflow` → `stpcpy`
#              → `sys_uname` → `handle_interrupt`（run #4 ish-smoke.log）
#          ⚠️ 这**不只是「编译器太严」**：真有一台宿主机名 >64 字符时，这条
#             `strcpy` 会写穿 65 字节字段、砸掉后面 `user_put` 要用的整个结构体。
#             所以这里按**真 bug** 修，而不是关掉 fortify。
#          改法：`strcpy(uts->hostname, hostname)` →
#                `snprintf(uts->hostname, sizeof(uts->hostname), "%s", hostname)`
#          ✅ 已把全树 65 处 `strcpy/strcat/sprintf` 逐个过了一遍（排除 app/ 与 deps/）：
#             只有这一处是「两边对象尺寸都已被编译器知道、且源 > 目标」⇒ 只有这一处
#             会被插无条件陷阱。其余要么源是裸指针（`__builtin_object_size` 未知 ⇒
#             不插），要么两边等长（如 fs/tmp.c:466 的 `NAME_MAX+1` 对 `NAME_MAX+1`）。
#  ⚠️ 补丁是**文本级、幂等**的（`sed` 只换调用点、`awk` 只包一行 include），
#     每轮都重新 clone 再打，不依赖 CI 缓存；打完后每条都自带「生效/幂等」校验，
#     不满足就 `::error::PATCH|` 挂掉整步（绝不静默带着半截补丁去编译）。
#     GPL 合规仍以 pinned commit 的源码本身为准。
#  ---------------------------------------------------------------------------
#  ⚠️ 为什么不再保留 Linux/arm64 那条线（run #4 的实测结论，**别再试**）
#  ---------------------------------------------------------------------------
#  run #4 实测：Linux 线上 `main.c` 与 `fs/fake.c` 大面积用了 Darwin 专有 API ——
#    · main.c:44-103   `uc->uc_mcontext->__ss.__x[]` / `__es.__esr`。Darwin 的
#      `mcontext_t` 是**指针**且带 `__ss`/`__es` 子结构；Linux 上 `mcontext_t`
#      是**结构体**、寄存器在 `.regs[]`、且**拿不到 ESR**（WnR 位）⇒ 14 处 error；
#    · fs/fake.c:505-507  `st_atimespec/st_mtimespec/st_ctimespec`（BSD 名，
#      Linux 叫 `st_atim/st_mtim/st_ctim`）；
#    · fs/fake.c:713,789   `F_GETPATH`（纯 Apple fcntl；Linux 只能退化到
#      `readlink("/proc/self/fd/N")`）。
#    把它编通等于**真的替上游做一次 Linux port**（还要接受 Linux 侧丢掉 ESR 语义），
#    远超「构建期文本补丁」的边界。而 macOS 那条线本来就能**完整**产出全部产物
#    （iOS 静态库 + vdso + host 工具 + Alpine fakefs）—— 因为 fakefs 本身就是
#    Darwin 原生实现（F_GETPATH、bind mount 全是 Apple 语义），macOS 才是它
#    **正确**的平台。所以那条线已整段删除：它除了把 workflow 长期染红
#    （老板收到的「打包失败」提醒就是它）之外，不产出任何 macOS 线拿不到的东西。
#  ⚠️ 为什么不用 `perl -pi` 也不写 `sed -i`：开发机是 Windows Git Bash，
#     ① 没有 perl ⇒ 补丁脚本在本地上推前**一次都验不了**（本文件严禁「没验就上」）；
#     ② BSD sed 与 GNU sed 的 `-i` 语法不同 ⇒ 同一条命令过不了两个 runner。
#     所以统一「sed/awk 输出到 mktemp 再 mv」，本机与两个 runner 行为一致。
#  ============================================================================

name: iSH Sandbox (manual)

# 触发方式：只手动；另外，改动「本文件自身」或 `ish-sandbox/**` 时会触发。
# ⚠️ 普通推送（改 Aevis/**、scripts/** 等）**不会**触发本 workflow —— 这是刻意的，
#    否则每轮源码推送都会连带重编一遍 iSH，代价太大。
on:
  workflow_dispatch:
    inputs:
      host_only:
        description: "只跑 host 工具构建（快速诊断，约 10-15 分钟）"
        type: boolean
        default: false
  push:
    paths:
      - '.github/workflows/ish-sandbox.yml'
      - 'ish-sandbox/**'

# ⚠️ **不要**把 group 写成固定值（比如按分支名）——
#    改本文件时会连着触发两轮（旧版 + 新版），固定 group 会让第二轮**排队等第一轮跑完全程**
#    （各 50 分钟 ⇒ 白白多等一小时）。用 run_id 每轮各跑各的；本 workflow 是手动的，
#    不存在"被普通推送重复触发"的浪费问题。
concurrency:
  group: ish-sandbox-${{ github.run_id }}
  cancel-in-progress: false

# ⚠️ 必须给写权限：最后要把「分步耗时 / 产物大小 / 校验结果」发布成 Release。
#    为什么非要走 Release —— 开发机是 Windows、既没有 gh 也没有 token，
#    **job 日志和 artifact 都读不到**；而未认证的 Release API 是公开可读的，
#    是唯一能把这些数字取回来的通道。
permissions:
  contents: write

env:
  SBX: ${{ github.workspace }}/ish-sandbox
  ISH_REPO: "https://github.com/OpenMinis/ish-arm64"
  ISH_BRANCH: "feature-arm64"
  ISH_SHA: "54ca185b77f170e12fd353fcd7443232f6cb73fd"
  IOS_MIN: "15.0"
  ALPINE_SERIES: "3.21"
  ALPINE_VERSION: "3.21.3"
  ALPINE_SHA256: "ead8a4b37867bd19e7417dd078748e2312c0aea364403d96758d63ea8ff261ea"

jobs:
  build:
    name: Build iSH sandbox artifacts
    # macos-15 默认就是 Apple Silicon（M 系）——编 iOS arm64 静态库没问题。
    # ⚠️ 不要换成 macos-15-intel / macos-14-large 这类 Intel runner：
    #    asbestos 引擎只有面向 aarch64 主机的 guest-arm64 gadgets，x86_64 host 编不出来。
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      # —— 0. 环境自述 + 建目录 ——
      - name: Runner info
        run: |
          set -euo pipefail
          mkdir -p "$SBX" "$SBX/out" "$SBX/build" "$SBX/.cache" "$SBX/logs"
          : > "$SBX/timings.txt"
          echo "runner.os   = ${RUNNER_OS:-?}"
          echo "runner.arch = ${RUNNER_ARCH:-?}"
          echo "uname -m    = $(uname -m)"
          sw_vers
          xcodebuild -version
          echo "iphoneos SDK path: $(xcrun --sdk iphoneos --show-sdk-path)"
          echo "iphoneos SDK ver : $(xcrun --sdk iphoneos --show-sdk-version)"
          echo "macosx   SDK path: $(xcrun --sdk macosx --show-sdk-path)"

      # —— 1. 装编译依赖 ——
      #   meson / ninja        : 构建系统
      #   llvm / lld           : 编 guest VDSO（aarch64-linux-gnu 目标，用 llvm clang + ld.lld）
      #   libarchive           : host 版 fakefsify 需要（tools/meson.build 从 Homebrew 找它）
      - name: Install build tools (Homebrew)
        run: |
          set -euo pipefail
          SECONDS=0
          brew install meson ninja llvm lld libarchive
          echo "----- versions -----"
          echo "meson:      $(meson --version 2>/dev/null || echo '?')"
          echo "ninja:      $(ninja --version 2>/dev/null || echo '?')"
          echo "llvm clang: $(ls -d /opt/homebrew/opt/llvm/bin/clang 2>/dev/null || echo 'MISSING')"
          echo "ld.lld:     $(command -v ld.lld 2>/dev/null || ls /opt/homebrew/opt/lld/bin/ld.lld 2>/dev/null || echo 'MISSING')"
          echo "libarchive: $(ls -d /opt/homebrew/opt/libarchive 2>/dev/null || echo 'MISSING')"
          echo "phase brew: ${SECONDS}s" | tee -a "$SBX/timings.txt"

      # —— 2. 恢复缓存 ——
      #   key 里带本 workflow 文件的哈希 ⇒ 只要「脚本 / pinned SHA / 补丁」变了，
      #   缓存自动失效并重编；否则命中缓存，增量 ninja 几乎瞬间完成。
      # 缓存内容：两个 meson 构建目录 + Alpine 包缓存（源码 clone 每次重来，很便宜）。
      - name: Restore build cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ish-sandbox/build/ios-iphoneos
            ish-sandbox/build/native
            ish-sandbox/.cache
          key: ish-sandbox-${{ runner.os }}-${{ hashFiles('.github/workflows/ish-sandbox.yml') }}

      # —— 3. 取 iSH 源码（pin 到固定 commit）——
      #   iSH 的三个 submodule（deps/libapps、deps/libarchive、deps/linux）在
      #   `-Dkernel=ish` 下**都用不到**（libarchive 走 Homebrew；linux 只在
      #   `-Dkernel=linux` 时编）。所以这里**不拉 submodule**，省时又省流量。
      - name: Fetch iSH source (pinned commit)
        run: |
          set -euo pipefail
          SECONDS=0
          mkdir -p "$SBX/src"
          rm -rf "$SBX/src/ish"
          git init -q "$SBX/src/ish"
          git -C "$SBX/src/ish" remote add origin "$ISH_REPO"
          git -C "$SBX/src/ish" config advice.detachedHead false
          if git -C "$SBX/src/ish" fetch -q --depth 1 origin "$ISH_SHA"; then
            echo "直接取到 pinned SHA"
            git -C "$SBX/src/ish" checkout -q FETCH_HEAD
          else
            # 退路：取整个分支历史（不浅），保证 pinned SHA 的对象一定在本地。
            # 分支头以后可能前进，浅取分支头就拿不到旧 commit 了，所以这里不用 --depth。
            echo "取不到单个 SHA，退回取分支历史再 checkout"
            git -C "$SBX/src/ish" fetch -q origin "$ISH_BRANCH"
            git -C "$SBX/src/ish" checkout -q "$ISH_SHA"
          fi
          GOT="$(git -C "$SBX/src/ish" rev-parse HEAD)"
          echo "checked out: $GOT"
          if [ "$GOT" != "$ISH_SHA" ]; then
            echo "::error::pinned SHA 不一致：期望 $ISH_SHA，实际 $GOT"
            exit 1
          fi
          echo "源码文件数: $(find "$SBX/src/ish" -type f | wc -l | tr -d ' ')"
          echo "phase fetch: ${SECONDS}s" | tee -a "$SBX/timings.txt"

      # —— 3b. 上游补丁（两处，缘由见文件头「构建期补丁」）——
      #   ⚠️ 必须放在**任何编译步骤之前**：libish.a、iOS 静态库与 host 工具都吃这棵源码树。
      #   ⚠️ 只用 `sed` / `awk`，**不用 perl** —— 开发机（Windows Git Bash）没有 perl，
      #      用了就没法在上推之前先本地跑一遍验证；sed/awk 两边都有。
      #      并且**不用 `sed -i`**（BSD 与 GNU 的 -i 语法不同），改成「写临时文件再 mv」。
      - name: Patch iSH source (3 portability fixes)
        run: |
          set -euo pipefail
          SRC="$SBX/src/ish"

          # 补丁 1：native_offload.c 的 posix_spawn_file_actions_addchdir → _np
          #         （Apple SDK 只有 _np；不换就 `error: call to undeclared function`）
          F="$SRC/kernel/native_offload.c"
          n_before="$(grep -c 'posix_spawn_file_actions_addchdir(' "$F" || true)"
          tmp="$(mktemp)"
          sed 's|posix_spawn_file_actions_addchdir(|posix_spawn_file_actions_addchdir_np(|g' \
            "$F" > "$tmp"
          mv "$tmp" "$F"
          n_after="$(grep -c 'posix_spawn_file_actions_addchdir(' "$F" || true)"
          n_np="$(grep -c 'posix_spawn_file_actions_addchdir_np(' "$F" || true)"
          echo "patch1 native_offload.c: addchdir( $n_before -> $n_after ; addchdir_np( = $n_np"
          [ "$n_after" = "0" ] || { echo "::error::PATCH| native_offload.c 里还有 addchdir( 没换掉"; exit 1; }
          [ "$n_np" -ge 1 ]    || { echo "::error::PATCH| native_offload.c 里没有 addchdir_np( —— 补丁没生效"; exit 1; }
          grep -n 'addchdir' "$F"

          # 补丁 2：main.c 的死引用 <mach/mach.h> 用 #if defined(__APPLE__) 包起来
          #         （Linux runner 没这个头；Apple 上行为完全不变）
          F="$SRC/main.c"
          n_before2="$(grep -c '^#include <mach/mach.h>$' "$F" || true)"
          tmp="$(mktemp)"
          # ⚠️ `prev != "#if defined(__APPLE__)"` 是**幂等**用的：第二遍跑的时候
          #    上一行已经是 `#if defined(__APPLE__)`，就不会再包一层。
          awk '{ if ($0 == "#include <mach/mach.h>" && prev != "#if defined(__APPLE__)") {
                   print "#if defined(__APPLE__)"; print; print "#endif"
                 } else { print }
                 prev = $0 }' "$F" > "$tmp"
          mv "$tmp" "$F"
          # 数「#if defined(__APPLE__) / #include <mach/mach.h> / #endif」这个三层块出现了几次
          n_wrap="$(awk 'a == "#if defined(__APPLE__)" && b == "#include <mach/mach.h>" && $0 == "#endif" { n++ } { a = b; b = $0 } END { print n + 0 }' "$F")"
          echo "patch2 main.c: mach include 原 $n_before2 处 -> 包裹块 = $n_wrap"
          [ "$n_before2" -ge 1 ] || { echo "::error::PATCH| main.c 里没找到 `<mach/mach.h>` 那一行"; exit 1; }
          [ "$n_wrap" = "1" ]    || { echo "::error::PATCH| main.c 的包裹块 = $n_wrap（应为 1）"; exit 1; }
          echo "--- main.c 前 12 行 ---"
          sed -n '1,12p' "$F"

          # 补丁 3：kernel/uname.c —— guest 的 struct uname 字段只有 65 字节
          #         （UNAME_LENGTH，kernel/calls.h:256），宿主 macOS 的 utsname 字段
          #         是 256 字节（_SYS_NAMELEN）。`strcpy(uts->hostname, 宿主机名)`
          #         被 clang 的 _FORTIFY_SOURCE 静态判成「源 256 > 目标 65」，
          #         直接插一条**无条件** __chk_fail_overflow() ⇒ 一调 uname 就崩
          #         （run #4：HOST CRASH signal 5 → __chk_fail_overflow → stpcpy
          #          → sys_uname → handle_interrupt）。
          #         ⚠️ 真有一条 >64 字符的宿主机名时，这条 strcpy 会写穿 65 字节
          #            字段、砸掉后面 user_put 要用的结构体 —— 是**真 bug**，
          #            所以按 bug 修（换成 snprintf 按目标尺寸截断），不是关掉 fortify。
          F="$SRC/kernel/uname.c"
          [ -f "$F" ] || { echo "::error::PATCH| 没有 kernel/uname.c"; exit 1; }
          n3_before="$(grep -c 'strcpy(uts->hostname, hostname);' "$F" || true)"
          tmp="$(mktemp)"
          sed 's|strcpy(uts->hostname, hostname);|snprintf(uts->hostname, sizeof(uts->hostname), "%s", hostname);|' \
            "$F" > "$tmp"
          mv "$tmp" "$F"
          n3_after="$(grep -c 'strcpy(uts->hostname, hostname);' "$F" || true)"
          n3_new="$(grep -c 'snprintf(uts->hostname, sizeof(uts->hostname), "%s", hostname);' "$F" || true)"
          echo "patch3 kernel/uname.c: 旧 strcpy( $n3_before 处 -> $n3_after ; 新 snprintf( = $n3_new"
          # ⚠️ 不要求 n3_before>=1（幂等：第二遍跑时它本来就是 0）；
          #    只要求「旧形态没了、新形态在」。
          [ "$n3_after" = "0" ] || { echo "::error::PATCH| kernel/uname.c 里还有旧的 strcpy(uts->hostname, ...) 没换掉"; exit 1; }
          [ "$n3_new" -ge 1 ]   || { echo "::error::PATCH| kernel/uname.c 的 snprintf 补丁没生效"; exit 1; }
          grep -n 'hostname' "$F"

          echo "三处补丁全部完成。"

      # —— 4. 编 iOS 真机 arm64 静态库 ——
      #   交叉编译文件用 iphoneos SDK，部署目标 iOS $IOS_MIN，host_machine 声明为
      #   darwin/aarch64（这样 meson 会挑 platform/darwin.c 与 guest-arm64/gadgets-aarch64）。
      #   🔴 只编 arm64 device slice：不编 x86_64 simulator（asbestos 没有 x86_64 gadgets）。
      - name: Build iOS static libraries (device, arm64)
        if: ${{ inputs.host_only != true }}
        run: |
          set -euo pipefail
          SECONDS=0
          SRC="$SBX/src/ish"
          BUILD="$SBX/build/ios-iphoneos"
          CROSS="$SBX/ios-cross.txt"
          IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          printf '%s\n' \
            "[binaries]" \
            "c = ['clang', '-arch', 'arm64', '-isysroot', '$IOS_SDK', '-miphoneos-version-min=$IOS_MIN']" \
            "ar = 'ar'" \
            "strip = 'strip'" \
            "pkg-config = 'false'" \
            "" \
            "[host_machine]" \
            "system = 'darwin'" \
            "cpu_family = 'aarch64'" \
            "cpu = 'aarch64'" \
            "endian = 'little'" \
            "" \
            "[built-in options]" \
            "c_args = []" \
            "c_link_args = ['-L$IOS_SDK/usr/lib']" \
            "" \
            "[properties]" \
            "needs_exe_wrapper = true" \
            "sys_root = '$IOS_SDK'" \
            "library_dirs = ['$IOS_SDK/usr/lib']" \
            > "$CROSS"
          echo "----- ios-cross.txt -----"
          cat "$CROSS"
          if [ ! -f "$BUILD/build.ninja" ]; then
            rm -rf "$BUILD"; mkdir -p "$BUILD"
            meson setup "$BUILD" "$SRC" \
              --cross-file "$CROSS" \
              --buildtype=release -Db_ndebug=true \
              -Dlog= -Dlog_handler=nslog \
              -Dkernel=ish -Dengine=asbestos -Dguest_arch=arm64
          else
            echo "复用已有构建目录，重新配置"
            meson configure "$BUILD" --buildtype=release -Db_ndebug=true
          fi
          ninja -C "$BUILD" libish.a libish_emu.a libfakefs.a
          for f in libish.a libish_emu.a libfakefs.a; do
            cp "$BUILD/$f" "$SBX/out/$f"
          done
          echo "phase ios-libs: ${SECONDS}s" | tee -a "$SBX/timings.txt"

      # —— 5. 编 guest VDSO（aarch64 Linux ELF）——
      #   这个目标其实会随 libish.a 一起编出来，这里单独跑一次只为单独计时。
      - name: Build guest VDSO (aarch64 Linux ELF)
        if: ${{ inputs.host_only != true }}
        run: |
          set -euo pipefail
          SECONDS=0
          export PATH="/opt/homebrew/opt/llvm/bin:$PATH"
          BUILD="$SBX/build/ios-iphoneos"
          ninja -C "$BUILD" vdso/arm64/libvdso.so.elf
          cp "$BUILD/vdso/arm64/libvdso.so.elf" "$SBX/out/libvdso.so.elf"
          file "$SBX/out/libvdso.so.elf"
          echo "phase vdso: ${SECONDS}s" | tee -a "$SBX/timings.txt"

      # —— 6. 编 host 版工具 ——
      #   fakefsify 把 minirootfs 转成 iSH 的 fakefs（data/ + meta.db）；
      #   ish 是能在 macOS 上直接跑沙箱的 CLI（后面拿来做冒烟测试、打 rootfs）。
      #   ⚠️ native 构建要用 **macOS SDK**，并清掉 Xcode 注入的 IPHONEOS_DEPLOYMENT_TARGET。
      #   ⚠️ 三条命令各自 tee 到 $SBX/logs/，失败照样让整步失败（不用 || true）——
      #      开发机读不到 job 日志，这些文件会由第 12 步带到 Release 上。
      - name: Build host tools (fakefsify, ish)
        run: |
          set -euo pipefail
          SECONDS=0
          SRC="$SBX/src/ish"
          BUILD="$SBX/build/native"
          LOGS="$SBX/logs"
          HOST_SDK="$(xcrun --sdk macosx --show-sdk-path)"
          export PATH="/opt/homebrew/opt/llvm/bin:$PATH"
          mkdir -p "$LOGS"

          # —— 诊断：先把环境摸清楚，全部落盘 ——
          {
            echo "=== host 工具构建环境 ==="
            echo "meson  --version : $(meson --version 2>&1)"
            echo "ninja  --version : $(ninja --version 2>&1)"
            echo "clang  --version : $(clang --version 2>&1 | head -1)"
            echo "xcrun macosx SDK : $HOST_SDK"
            echo "brew --prefix libarchive              : $(brew --prefix libarchive 2>&1)"
            echo "pkg-config --modversion libarchive    : $(pkg-config --modversion libarchive 2>&1)"
            echo "pkg-config --variable=libdir libarchive: $(pkg-config --variable=libdir libarchive 2>&1)"
            echo "PKG_CONFIG_PATH (before)              : ${PKG_CONFIG_PATH:-<unset>}"
            echo "--- ls -la /opt/homebrew/opt/libarchive/lib /opt/homebrew/opt/libarchive/include ---"
            ls -la /opt/homebrew/opt/libarchive/lib /opt/homebrew/opt/libarchive/include 2>&1 || true
            echo "--- ls -la /opt/homebrew/opt/libarchive/lib/pkgconfig ---"
            ls -la /opt/homebrew/opt/libarchive/lib/pkgconfig 2>&1 || true
          } 2>&1 | tee "$LOGS/host-env.log"

          # libarchive 是 fakefsify 唯一的外部依赖，而它在 macOS 上是 keg-only：
          # Homebrew **不会**把它挂进 pkg-config 的默认搜索路径。找不到 libarchive，
          # tools/meson.build 就干脆不生成 fakefsify 目标 ⇒ ninja 报 unknown target。
          # ⚠️ meson **没有** `--pkg-config-path` 这个命令行开关（查过 msetup.py，确实没有）；
          #    正规做法是内置选项 `-Dpkg_config_path=...`，这里再 export 环境变量兜一层。
          LIBARCHIVE_PREFIX="$(brew --prefix libarchive 2>/dev/null || true)"
          LIBARCHIVE_PC=""
          if [ -n "$LIBARCHIVE_PREFIX" ] && [ -d "$LIBARCHIVE_PREFIX/lib/pkgconfig" ]; then
            LIBARCHIVE_PC="$LIBARCHIVE_PREFIX/lib/pkgconfig"
          fi
          if [ -n "$LIBARCHIVE_PC" ]; then
            export PKG_CONFIG_PATH="$LIBARCHIVE_PC:${PKG_CONFIG_PATH:-}"
          fi
          # meson 会用「内置选项 pkg_config_path」**覆盖**继承来的 PKG_CONFIG_PATH，
          # 所以上面那句 export 只对下面这条 shell 诊断命令有效；真正喂给 meson 的
          # 是 -Dpkg_config_path。拼成一个变量，路径为空时就不传这个参数
          # （避免 `-Dpkg_config_path=` 这种空值形态）。
          PC_ARG=""
          if [ -n "$LIBARCHIVE_PC" ]; then
            PC_ARG="-Dpkg_config_path=$LIBARCHIVE_PC"
          fi
          echo "libarchive pkgconfig dir = ${LIBARCHIVE_PC:-<not found>}"
          echo "PKG_CONFIG_PATH (after)  = ${PKG_CONFIG_PATH:-<unset>}"
          echo "pkg-config --modversion libarchive (after) = $(pkg-config --modversion libarchive 2>&1 || true)"

          # —— 三条命令，各自 tee 落盘；失败时按原状 exit（日志已落盘）——
          if [ ! -f "$BUILD/build.ninja" ]; then
            rm -rf "$BUILD"; mkdir -p "$BUILD"
            set +e
            env -u IPHONEOS_DEPLOYMENT_TARGET SDKROOT="$HOST_SDK" \
              meson setup "$BUILD" "$SRC" \
                ${PC_ARG} \
                --buildtype=release \
                -Dlog= -Dkernel=ish -Dengine=asbestos -Dguest_arch=arm64 \
              2>&1 | tee "$LOGS/host-setup.log"
            rc=${PIPESTATUS[0]}; set -e
            [ "$rc" = 0 ] || {
              echo "::error::HOSTBUILD| meson setup 失败 rc=$rc"
              tail -n 10 "$LOGS/host-setup.log" 2>/dev/null \
                | sed -e 's/%/%25/g' -e 's/::/∶∶/g' \
                | while IFS= read -r l; do echo "::error::HOSTBUILD| $l"; done || true
              exit "$rc"
            }
          else
            echo "复用已有 native 构建目录（跳过 setup）" | tee "$LOGS/host-setup.log"
          fi

          set +e
          env -u IPHONEOS_DEPLOYMENT_TARGET SDKROOT="$HOST_SDK" \
            ninja -C "$BUILD" cpu-offsets.h 2>&1 | tee "$LOGS/host-offsets.log"
          rc=${PIPESTATUS[0]}; set -e
          [ "$rc" = 0 ] || {
            echo "::error::HOSTBUILD| ninja cpu-offsets.h 失败 rc=$rc"
            tail -n 10 "$LOGS/host-offsets.log" 2>/dev/null \
              | sed -e 's/%/%25/g' -e 's/::/∶∶/g' \
              | while IFS= read -r l; do echo "::error::HOSTBUILD| $l"; done || true
            exit "$rc"
          }

          # ⚠️ `-k 0`（keep-going）：上游是别人写的代码，第一处报错后面往往还藏着
          #    第二处。不加就是「修一处、等 20 分钟、再发现下一处」；加了就一次全暴露。
          set +e
          env -u IPHONEOS_DEPLOYMENT_TARGET SDKROOT="$HOST_SDK" \
            ninja -k 0 -C "$BUILD" tools/fakefsify ish 2>&1 | tee "$LOGS/host-ninja.log"
          rc=${PIPESTATUS[0]}; set -e
          [ "$rc" = 0 ] || {
            echo "::error::HOSTBUILD| ninja tools/fakefsify ish 失败 rc=$rc"
            tail -n 10 "$LOGS/host-ninja.log" 2>/dev/null \
              | sed -e 's/%/%25/g' -e 's/::/∶∶/g' \
              | while IFS= read -r l; do echo "::error::HOSTBUILD| $l"; done || true
            exit "$rc"
          }

          cp "$BUILD/tools/fakefsify" "$SBX/out/fakefsify"
          cp "$BUILD/ish" "$SBX/out/ish"
          chmod +x "$SBX/out/fakefsify" "$SBX/out/ish"
          echo "phase host-tools: ${SECONDS}s" | tee -a "$SBX/timings.txt"

      # —— 7. 打 Alpine rootfs（只能在 macOS 上做，因为 fakefsify 是 macOS 原生二进制）——
      #   下 Alpine 3.21.3 aarch64 minirootfs（多镜像回退 + 强制 sha256 校验）
      #   → 解包 → 写 /etc/resolv.conf、/etc/apk/repositories、删 EXTERNALLY-MANAGED（放开 pip）
      #   → 重新打包 → fakefsify 转成 fakefs（data/ + meta.db）→ zip。
      - name: Prepare Alpine aarch64 rootfs (fakefs)
        if: ${{ inputs.host_only != true }}
        run: |
          set -euo pipefail
          SECONDS=0
          FAKEFSIFY="$SBX/out/fakefsify"
          TARBALL="$SBX/.cache/alpine-minirootfs-${ALPINE_VERSION}-aarch64.tar.gz"
          mkdir -p "$SBX/.cache" "$SBX/out"
          if [ ! -s "$TARBALL" ]; then
            ok=0
            for M in \
              "https://mirrors.aliyun.com/alpine" \
              "https://mirrors.tuna.tsinghua.edu.cn/alpine" \
              "https://mirrors.ustc.edu.cn/alpine" \
              "https://dl-cdn.alpinelinux.org/alpine"; do
              URL="$M/v${ALPINE_SERIES}/releases/aarch64/alpine-minirootfs-${ALPINE_VERSION}-aarch64.tar.gz"
              echo "download: $URL"
              if curl -fL --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 300 -o "$TARBALL" "$URL"; then
                ok=1; break
              fi
            done
            [ "$ok" = 1 ] || { echo "::error::minirootfs 在所有镜像都下不动"; exit 1; }
          else
            echo "使用缓存的 minirootfs"
          fi
          GOT="$(shasum -a 256 "$TARBALL" | awk '{print $1}')"
          echo "minirootfs sha256 = $GOT"
          [ "$GOT" = "$ALPINE_SHA256" ] || { echo "::error::sha256 校验失败（期望 $ALPINE_SHA256）"; exit 1; }

          TREE="$SBX/alpine-tree"
          rm -rf "$TREE"; mkdir -p "$TREE"
          tar -xzf "$TARBALL" -C "$TREE"

          # —— 容器内部一律走国内源（老板口径：「Linux 就是自带容器」——
          #    容器里要下东西，得让它自己从国内云拉，不依赖我们这边的网络）——
          # ① DNS：阿里 + 腾讯 + 114（别再用 1.1.1.1/8.8.8.8，国内解析又慢又不稳）
          printf 'nameserver 223.5.5.5\nnameserver 119.29.29.29\nnameserver 114.114.114.114\n' \
            > "$TREE/etc/resolv.conf"
          # ② apk 源：清华 TUNA 主 + 阿里云备 + 官方兜底（apk 按行顺序找）。
          #    ⚠️ 只放 2 个国内源是**刻意的**：`apk update` 会把列出的每个仓库索引都拉一遍，
          #       源越多每次更新越慢（社区索引就有好几 MB）。排在前面的是国内，够用了；
          #       真要再加，把中科大那两行注释放开即可。
          #    ✅ 证书没问题：minirootfs 自带 /etc/ssl/certs/ca-certificates.crt（222 KB）
          #    ✅ 签名没问题：自带 /etc/apk/keys/*（5 把）+ /usr/share/apk/keys/*（18 把）
          {
            for M in \
              "https://mirrors.tuna.tsinghua.edu.cn/alpine" \
              "https://mirrors.aliyun.com/alpine"; do
              printf '%s/v%s/main\n%s/v%s/community\n' "$M" "$ALPINE_SERIES" "$M" "$ALPINE_SERIES"
            done
            # "https://mirrors.ustc.edu.cn/alpine"   # ← 想再加一个国内源就把这两行放开
            printf 'https://dl-cdn.alpinelinux.org/alpine/v%s/main\nhttps://dl-cdn.alpinelinux.org/alpine/v%s/community\n' \
              "$ALPINE_SERIES" "$ALPINE_SERIES"
          } > "$TREE/etc/apk/repositories"
          # ③ pip 源：清华主 + 阿里/腾讯备（下面已经删掉 EXTERNALLY-MANAGED，pip 直接用）
          printf '[global]\nindex-url = https://pypi.tuna.tsinghua.edu.cn/simple\nextra-index-url = https://mirrors.aliyun.com/pypi/simple/\n                  https://mirrors.cloud.tencent.com/pypi/simple/\n' \
            > "$TREE/etc/pip.conf"
          # ④ npm 源：npmmirror（阿里）。全局 /etc/npmrc 与 root 的 ~/.npmrc 各放一份。
          printf 'registry=https://registry.npmmirror.com\n' > "$TREE/etc/npmrc"
          mkdir -p "$TREE/root"
          printf 'registry=https://registry.npmmirror.com\n' > "$TREE/root/.npmrc"
          find "$TREE/usr/lib" -name EXTERNALLY-MANAGED -delete 2>/dev/null || true
          mkdir -p "$TREE/dev" "$TREE/proc" "$TREE/sys" "$TREE/tmp" "$TREE/run" "$TREE/root" "$TREE/home"

          CONFIG_TAR="$SBX/.cache/alpine-configured.tar.gz"
          rm -f "$CONFIG_TAR"
          tar -czf "$CONFIG_TAR" -C "$TREE" .

          FAKEFS="$SBX/alpine-fakefs"
          rm -rf "$FAKEFS"
          "$FAKEFSIFY" "$CONFIG_TAR" "$FAKEFS"
          [ -d "$FAKEFS/data" ]   || { echo "::error::fakefsify 没产出 data/"; exit 1; }
          [ -f "$FAKEFS/meta.db" ] || { echo "::error::fakefsify 没产出 meta.db"; exit 1; }
          [ -e "$FAKEFS/data/bin/sh" ] || { echo "::error::fakefs 里没有 /bin/sh"; exit 1; }

          printf 'alpine-%s-r1\n' "$ALPINE_VERSION" > "$FAKEFS/.version"
          printf 'aarch64\n' > "$FAKEFS/.arch"

          rm -f "$SBX/out/alpine-rootfs.zip"
          ( cd "$FAKEFS" && zip -qry "$SBX/out/alpine-rootfs.zip" . -x '*.db-shm' -x '*.db-wal' )
          echo "phase rootfs: ${SECONDS}s" | tee -a "$SBX/timings.txt"

      # —— 8. 冒烟测试：用 host 版 ish 真的把 Alpine 跑起来 ——
      #   这是「不只是编出来、而是真的能跑」的硬证据。失败只告警、不挂整个 job
      #   （真机上的行为才是最终标准，这里只是提前发现问题）。
      - name: Smoke test - boot Alpine + verify in-container mirrors
        if: ${{ inputs.host_only != true }}
        continue-on-error: true
        run: |
          set -uo pipefail
          ISH="$SBX/out/ish"
          FAKEFS="$SBX/alpine-fakefs"

          # 跑一条「容器内命令」，硬限时（macOS runner 没有 GNU `timeout`，自己数秒）。
          run_probe () {
            name="$1"; limit="$2"; log="$3"; cmd="$4"
            : > "$log"
            "$ISH" -f "$FAKEFS" /bin/sh -c "$cmd" >> "$log" 2>&1 &
            pid=$!
            i=0
            while [ "$i" -lt "$limit" ]; do
              kill -0 "$pid" 2>/dev/null || break
              sleep 1
              i=$((i + 1))
            done
            if kill -0 "$pid" 2>/dev/null; then
              echo "[$name] 超时（${limit}s），杀掉"
              kill -9 "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            fi
            echo "----- $name -> $log -----"
            cat "$log" 2>/dev/null || true
          }

          # 探针 1：容器到底跑不跑得起来（这是「不只是编出来、而是真能跑」的硬证据）。
          run_probe "boot" 90 "$SBX/out/ish-smoke.log" \
            'echo AEVIS_ISH_SMOKE_OK; cat /etc/alpine-release; uname -m'

          # 探针 2（老板口径「Linux 就是自带容器」）：容器能不能**自己从国内源下东西**。
          #   真的 `apk update` + `apk add bash`（几百 KB），证据落 ish-mirror.log。
          #   ⚠️ 它会改动 alpine-fakefs，但 zip 在上一步就已经打好了 ⇒ 不会污染产物。
          run_probe "mirror" 240 "$SBX/out/ish-mirror.log" \
            'cat /etc/resolv.conf; grep -m1 tuna /etc/apk/repositories; apk update; apk add --no-cache bash; bash --version | head -1; echo AEVIS_ISH_MIRROR_OK'

          ok=1
          grep -q AEVIS_ISH_SMOKE_OK "$SBX/out/ish-smoke.log" 2>/dev/null \
            || { echo "::warning::host ish 冒烟测试没打印 OK（见 ish-smoke.log）"; ok=0; }
          grep -q AEVIS_ISH_MIRROR_OK "$SBX/out/ish-mirror.log" 2>/dev/null \
            || { echo "::warning::容器里没能从国内源装成包（见 ish-mirror.log）"; ok=0; }
          if [ "$ok" = 1 ]; then echo "冒烟 + 容器内国内源下载：OK"; fi

      # —— 9. 验收：逐个检查产物 + 打印大小 + 打印分步耗时 ——
      - name: Validate artifacts and report sizes/timings
        if: ${{ inputs.host_only != true }}
        run: |
          set -euo pipefail
          OUT="$SBX/out"
          fail=0

          echo "===== 产物大小 (artifact sizes) ====="
          for f in libish.a libish_emu.a libfakefs.a libvdso.so.elf fakefsify ish alpine-rootfs.zip; do
            if [ -e "$OUT/$f" ]; then
              printf '  %-18s %s\n' "$f" "$(du -h "$OUT/$f" | cut -f1)"
            else
              printf '  %-18s MISSING\n' "$f"
              fail=1
            fi
          done
          echo "  rootfs data/      $(du -sh "$SBX/alpine-fakefs/data" 2>/dev/null | cut -f1)"
          echo "  rootfs meta.db    $(du -h "$SBX/alpine-fakefs/meta.db" 2>/dev/null | cut -f1)"

          echo ""
          echo "===== 架构检查 (arch check) ====="
          for f in libish.a libish_emu.a libfakefs.a; do
            echo "--- $f ---"
            file "$OUT/$f"
            lipo -info "$OUT/$f"
            lipo -info "$OUT/$f" | grep -q arm64 || { echo "::error::$f 不是 arm64"; fail=1; }
          done
          echo "--- libvdso.so.elf ---"
          file "$OUT/libvdso.so.elf"
          file "$OUT/libvdso.so.elf" | grep -qi 'aarch64' || echo "::warning::libvdso 架构可能不对"
          echo "--- host tools ---"
          file "$OUT/fakefsify" "$OUT/ish"

          echo ""
          echo "===== rootfs zip 内容检查 ====="
          # ⚠️ 先落盘再 grep，不要 `unzip -l | grep -q`：
          #   fakefs 里文件成千上万，`grep -q` 一命中就退出会让 unzip 收到 SIGPIPE，
          #   配上 `set -o pipefail` 会被误判成失败 —— 明明有 data/ 却说没有。
          LIST="$SBX/zip-listing.txt"
          unzip -l "$OUT/alpine-rootfs.zip" > "$LIST"
          grep -E '(^| )data/|meta\.db' "$LIST" | head -5 || true
          grep -q 'data/'   "$LIST" || { echo "::error::zip 里没有 data/";   fail=1; }
          grep -q 'meta.db' "$LIST" || { echo "::error::zip 里没有 meta.db"; fail=1; }

          echo ""
          echo "===== 分步耗时 (phase timings) ====="
          cat "$SBX/timings.txt" | tee "$OUT/timings.txt"
          du -h "$OUT"/* 2>/dev/null | sort -h > "$OUT/sizes.txt" || true
          echo "(字节级大小见 sizes.txt)"

          # 把「架构 / 体积」证据落盘，供最后的 Release 报告取用（开发机读不到 job 日志）。
          {
            echo "== file =="
            file "$OUT"/libish.a "$OUT"/libish_emu.a "$OUT"/libfakefs.a \
                 "$OUT"/libvdso.so.elf "$OUT"/fakefsify "$OUT"/ish 2>&1
            echo "== lipo =="
            lipo -info "$OUT"/libish.a 2>&1
            echo "== sizes (bytes) =="
            ls -l "$OUT" 2>&1
            echo "== rootfs 大小 =="
            du -sh "$SBX/alpine-fakefs/data" "$SBX/alpine-fakefs/meta.db" 2>&1
          } > "$OUT/arch.txt" 2>&1 || true

          echo ""
          [ "$fail" = 0 ] || { echo "::error::产物验收未通过"; exit 1; }
          echo "全部验收项通过。"

      # —— 10. 任务摘要（页面上直接可见）——
      - name: Write job summary
        if: always()
        run: |
          {
            echo "# iSH sandbox build"
            echo ""
            echo "- run: ${{ github.run_number }}"
            echo "- iSH: \`OpenMinis/ish-arm64\` @ \`${ISH_SHA}\` (feature-arm64, GPL-3.0)"
            echo "- Alpine: ${ALPINE_VERSION} aarch64"
            echo ""
            echo "## 分步耗时"
            echo '```'
            cat "$SBX/timings.txt" 2>/dev/null || echo "(none)"
            echo '```'
            echo ""
            echo "## 产物大小"
            echo '```'
            ls -lh "$SBX/out" 2>/dev/null || echo "(none)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # —— 11. 上传产物 ——
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ish-sandbox-${{ github.run_number }}
          path: ish-sandbox/out/**
          if-no-files-found: error
          retention-days: 14

      # —— 12. 把「分步耗时 / 产物大小 / 校验结果 / 失败日志」发布成 Release ——
      # 为什么非要这一步：开发机是 Windows、**既没有 gh 也没有 token**，
      #   job 日志和 artifact 都读不到；而未认证的 Release API 是公开可读的，
      #   这是唯一能把数字取回来的通道。
      # `if: always()` —— **失败时更要出报告**：`timings.txt` 是一路 `tee -a` 累积的，
      #   它能直接指出「卡在哪一步、前面各步花了多久」。
      # 本步同时把 host 工具构建的失败日志（$SBX/logs/* ＋ meson-log.txt）收拢、
      #   贴进报告正文，并作为附件传上去 —— 这是这一轮改动的核心目的。
      - name: Publish report to Releases
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          mkdir -p "$SBX/out"

          # —— 收拢日志：runner 上的 logs/ → out/，并打一个 logs.tgz ——
          for f in host-env.log host-setup.log host-offsets.log host-ninja.log; do
            [ -f "$SBX/logs/$f" ] && cp "$SBX/logs/$f" "$SBX/out/$f"
          done
          if [ -f "$SBX/build/native/meson-logs/meson-log.txt" ]; then
            cp "$SBX/build/native/meson-logs/meson-log.txt" "$SBX/out/meson-log.txt"
          fi
          STAGE="$SBX/logstage"
          rm -rf "$STAGE"; mkdir -p "$STAGE"
          if [ -d "$SBX/logs" ]; then cp -R "$SBX/logs/." "$STAGE/" 2>/dev/null || true; fi
          [ -f "$SBX/out/meson-log.txt" ] && cp "$SBX/out/meson-log.txt" "$STAGE/meson-log.txt"
          tar -czf "$SBX/out/logs.tgz" -C "$STAGE" . 2>/dev/null || echo "::warning::logs.tgz 打包失败"

          show_log () {
            echo ""
            echo "## $1（最后 150 行）"
            echo '```'
            if [ -f "$2" ]; then tail -150 "$2"; else echo "(缺失：$2)"; fi
            echo '```'
          }

          REPORT="$SBX/out/REPORT.md"
          {
            echo "# iSH sandbox build report — run #${{ github.run_number }}"
            echo ""
            echo "- job 结论: **${{ job.status }}**"
            echo "- iSH 源码: \`${ISH_REPO}\` @ \`${ISH_SHA}\` （GPL-3.0）"
            echo "- Alpine: ${ALPINE_VERSION} aarch64"
            echo "- runner: ${{ runner.os }} / ${{ runner.arch }}"
            echo ""
            echo "## 分步耗时"
            echo '```'
            cat "$SBX/timings.txt" 2>/dev/null || echo "(timings.txt 没生成 —— 说明很早就挂了)"
            echo '```'
            echo ""
            echo "## 产物大小"
            echo '```'
            ls -lh "$SBX/out" 2>/dev/null || echo "(out/ 是空的)"
            echo '```'
            echo ""
            echo "## 架构 / 体积证据"
            echo '```'
            cat "$SBX/out/arch.txt" 2>/dev/null || echo "(arch.txt 没生成)"
            echo '```'
            echo ""
            echo "## 冒烟测试日志（host iSH 真的把 Alpine 跑起来）"
            echo '```'
            tail -40 "$SBX/out/ish-smoke.log" 2>/dev/null || echo "(没有冒烟日志)"
            echo '```'
            echo ""
            echo "## 容器内「自己从国内源下东西」证据（apk update / apk add bash）"
            echo '```'
            tail -60 "$SBX/out/ish-mirror.log" 2>/dev/null || echo "(没有 mirror 日志)"
            echo '```'
            show_log "host 工具环境 (host-env.log)" "$SBX/out/host-env.log"
            show_log "host meson setup (host-setup.log)" "$SBX/out/host-setup.log"
            show_log "host ninja cpu-offsets.h (host-offsets.log)" "$SBX/out/host-offsets.log"
            show_log "host ninja fakefsify/ish (host-ninja.log)" "$SBX/out/host-ninja.log"
            show_log "meson 内部日志 (meson-log.txt)" "$SBX/out/meson-log.txt"
          } > "$REPORT"
          cat "$REPORT"

          # 只 attach 真实存在的文件：缺文件绝不能因此让这一步失败。
          # ⚠️ tag 固定为 ish-sandbox-macos-<run>：带上 run 号，同一轮重复触发（改本文件时
          #    会连着起两轮）不会互相覆盖，否则 `gh release create` 会因 tag 已存在而失败。
          TAG="ish-sandbox-macos-${{ github.run_number }}"
          ATTACH=()
          for f in "$SBX/out/logs.tgz" "$SBX/out/host-env.log" "$SBX/out/host-setup.log" \
                   "$SBX/out/host-offsets.log" "$SBX/out/host-ninja.log" "$SBX/out/meson-log.txt" \
                   "$SBX/out/ish-smoke.log" "$SBX/out/ish-mirror.log" \
                   "$SBX/out/timings.txt" "$SBX/out/arch.txt" "$SBX/out/sizes.txt"; do
            [ -f "$f" ] && ATTACH+=("$f")
          done

          # 兜底概括注解：只要 host 工具那步没产出 fakefsify/ish，就抛一条。
          # （注解是唯一「不需要仓库管理员权限、用 API 就能读回来」的通道。）
          if [ ! -f "$SBX/out/fakefsify" ] || [ ! -f "$SBX/out/ish" ]; then
            echo "::error::HOSTTOOLS| host 工具构建失败（没有产出 fakefsify/ish），详见附件 logs.tgz / host-ninja.log"
          fi

          # ⚠️ 必须带 --repo：本 workflow 没有 actions/checkout，$GITHUB_WORKSPACE
          #    不是一个 git 仓库，gh 推断不出仓库名会直接失败（上一轮就是这样被静默吞掉的）。
          # ⚠️ 失败不再用 `|| echo warning` 吞掉 —— 改成抛注解，让报错能被读到。
          ROUT=""
          if [ "${#ATTACH[@]}" -gt 0 ]; then
            ROUT="$(gh release create "$TAG" --repo "${{ github.repository }}" --title "$TAG" --notes-file "$REPORT" "${ATTACH[@]}" 2>&1)" || {
              echo "::error::RELEASE| gh release create 失败: $(printf '%s' "$ROUT" | head -c 300 | tr '\n' ' ' | sed -e 's/%/%25/g' -e 's/::/∶∶/g')"
            }
          else
            ROUT="$(gh release create "$TAG" --repo "${{ github.repository }}" --title "$TAG" --notes-file "$REPORT" 2>&1)" || {
              echo "::error::RELEASE| gh release create 失败: $(printf '%s' "$ROUT" | head -c 300 | tr '\n' ' ' | sed -e 's/%/%25/g' -e 's/::/∶∶/g')"
            }
          fi
          [ -z "$ROUT" ] || echo "gh release 输出：$ROUT"

      # —— 13. 保存缓存（只在成功时保存，避免把半截构建目录写进不可变缓存）——
      # ⚠️ `continue-on-error: true` 是必须的：本 workflow 的缓存 key 不含 run 维度，
      #    先用 `host_only=true` 跑一轮诊断、再跑一轮全量时，全量那轮会 **restore 到同一个 key**
      #    ⇒ `actions/cache/save` 报 "Cache already exists" 并 **exit 1** ⇒ 把明明构建成功的
      #    一轮标成失败（假红灯）。加了这个就不会。
      - name: Save build cache
        if: success()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ish-sandbox/build/ios-iphoneos
            ish-sandbox/build/native
            ish-sandbox/.cache
          key: ish-sandbox-${{ runner.os }}-${{ hashFiles('.github/workflows/ish-sandbox.yml') }}

# ⚠️ 原本这里还有第二条线 `build-rootfs-linux-arm`（ubuntu-24.04-arm）。
#    已于 2026-10-06 整段删除：原因见文件头「为什么不再保留 Linux/arm64 那条线」。
